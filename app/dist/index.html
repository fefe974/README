icio directo. El predial no lo es, y por eso la contabilidad del condado no puede funcionar como la de la cafetería."},"a1-1":{title:"Aplicar las tres pruebas a un museo",setup:"El Museo Regional de Valle Verde es privado, cobra entrada de $40 y termina el año con $180 000 de superávit. ¿Es una entidad sin fines de lucro según el FASB?",viz:{v:"flow",nodes:[{label:"Prueba (a) · aportantes sin retorno proporcional",sub:"Recibió $2,1 M en donativos. Los donantes no reciben nada a cambio.",tone:"ok"},{label:"Prueba (b) · propósito distinto de la utilidad",sub:"Su fin es conservar y exhibir, no generar utilidad.",tone:"ok"},{label:"Prueba (c) · sin intereses de propiedad",sub:"Nadie posee una parte que pueda vender o redimir.",tone:"ok"}]},steps:["El superávit de $180 000 <em>no</em> descalifica nada: ninguna de las tres pruebas habla de resultados.","Prueba (a): los donantes aportan $2,1 M sin esperar devolución. Cumple.","Prueba (b): el propósito operativo es conservar y exhibir, no lucrar. Cumple.","Prueba (c): no hay acciones ni participaciones vendibles. Cumple."],answer:"Cumple las tres, así que es una entidad sin fines de lucro. Tener superávit es normal y permitido — lo que importa es el propósito y la ausencia de dueños."},"a1-2":{title:"Un superávit que esconde un problema",setup:"Valle Verde cierra el año con $2 000 000 más de lo que gastó. El tesorero lo presenta como un año excelente.",viz:{v:"ledger",cols:["Indicador","Cifra"],rows:[{cells:["Recursos menos gastos","+$2 000 000"],tone:"ok"},{cells:["Baches sin reparar","1 840"],tone:"no"},{cells:["Tiempo de respuesta de bomberos","11 min"],tone:"no"},{cells:["Mantenimiento pospuesto","$6 300 000"],tone:"no"}]},steps:["En una empresa, $2 M de utilidad casi siempre es buena noticia.","Aquí el superávit salió de <em>no</em> prestar servicios: se pospuso mantenimiento por $6,3 M.","El condado no compite: los residentes no pueden irse a otro proveedor de bomberos.","Entonces la cifra no mide desempeño. Solo mide que entró más de lo que salió."],answer:"Ninguna cifra única sirve para juzgar a un gobierno. Hay que preguntar además si cumplió lo que el público decidió y si usó bien los recursos — las dos preguntas del artículo II."},"a1-3":{title:"Cuatro entidades del mismo condado",setup:"Clasifica cada una como gobierno de propósito general o especial.",viz:{v:"ledger",cols:["Entidad","Funciones"],rows:[{cells:["Condado de Valle Verde","muchas"],tone:"seal"},{cells:["Ciudad de San Ramón","muchas"],tone:"seal"},{cells:["Distrito Escolar de Valle Verde","una"],tone:"ok"},{cells:["Distrito de Control de Inundaciones","una"],tone:"ok"}]},steps:["La prueba no es el tamaño ni el presupuesto: es <em>cuántas funciones distintas</em> presta.","El condado da seguridad, calles, salud, parques y registro civil. Muchas funciones.","La ciudad de San Ramón, lo mismo a menor escala. También muchas.","El distrito escolar solo educa; el de inundaciones solo drena. Una función cada uno."],answer:"Condado y ciudad son de <em>propósito general</em>; los dos distritos, de <em>propósito especial</em>. Los cuatro pueden gravar y recaudar — eso no los distingue."},"a2-0":{title:"El alcalde quiere gastar $500 000 no presupuestados",setup:"Tras una tormenta, el alcalde de San Ramón ordena reparar un puente por $500 000. No hay partida presupuestal para eso.",viz:{v:"flow",nodes:[{label:"El alcalde ordena el gasto",sub:"rama ejecutiva",tone:"plain"},{label:"El concejo debe autorizarlo",sub:"rama legislativa · el presupuesto es ley",tone:"seal"},{label:"Un tribunal puede revisarlo",sub:"rama judicial",tone:"plain"},{label:"El auditor lo revisará el año siguiente",sub:"y el electorado en la próxima elección",tone:"plain"}]},steps:["En una empresa, un director con autoridad de gasto firma y se ejecuta.","Aquí el presupuesto es una <em>autorización legal</em>: sin partida, el alcalde no puede gastar solo.","El concejo debe aprobar una modificación presupuestal. Esa es la rama legislativa limitando a la ejecutiva.","Y el reporte financiero del año tendrá que <em>demostrar</em> que la modificación existió y se respetó."],answer:"El poder está repartido y cada rama limita a la otra. El reporte financiero no solo informa: prueba que se obedeció la ley."},"a2-1":{title:"Una subvención con cuatro dueños",setup:"Valle Verde recibe $3 000 000 del gobierno federal para un programa de vivienda. ¿Ante quién responde por ese dinero?",viz:{v:"flow",nodes:[{label:"Gobierno federal",sub:"exige informe de uso y auditoría específica",tone:"seal"},{label:"Legislatura estatal",sub:"sus leyes también aplican al condado",tone:"seal"},{label:"Comisión del condado",sub:"aprobó aceptar la subvención por ordenanza",tone:"seal"},{label:"Los residentes",sub:"que pagan y reciben el servicio",tone:"seal"}]},steps:["El otorgante federal condiciona el uso: solo vivienda, solo familias de bajos ingresos.","Encima corren las leyes estatales sobre compras y contratación, que no desaparecen.","La comisión del condado tuvo que aprobar formalmente la aceptación.","Y los residentes pueden exigir cuentas por un programa financiado con recursos públicos."],answer:"Cuatro capas de restricción sobre un solo monto. Cada una crea un requisito de rendición de cuentas que el reporte tiene que poder demostrar."},"a2-2":{title:"Cumplió el presupuesto y aun así falló",setup:"El departamento de obras de Valle Verde gastó $11 800 000 contra un presupuesto autorizado de $12 000 000. Las calles empeoraron.",viz:{v:"split",whole:{label:"Un solo departamento, dos juicios",amount:"$11,8 M"},parts:[{label:"Fiscal · ¿gastó dentro de lo aprobado?",amount:"Sí",tone:"ok"},{label:"Operativa · ¿usó bien los recursos?",amount:"No",tone:"no"}]},steps:["Pregunta fiscal: ¿se mantuvo dentro de los $12 M autorizados? Sí, por $200 000.","Con eso basta para la rendición de cuentas <em>fiscal</em>: cumplió lo que el público decidió.","Pregunta operativa: ¿el gasto produjo calles en mejor estado? No: el índice de pavimento bajó.","Las dos respuestas son verdaderas al mismo tiempo, y ninguna sustituye a la otra."],answer:"Cumplir el presupuesto no prueba que se usaron bien los recursos. Por eso hacen falta dos juegos de estados, uno para cada pregunta."},"a2-3":{title:"El año en que alguien más pagó la cuenta",setup:"En 2024 Valle Verde recaudó $48 000 000 y el costo de los servicios que prestó fue de $52 000 000. La diferencia se cubrió emitiendo deuda.",viz:{v:"split",whole:{label:"Costo de los servicios de 2024",amount:"$52 M"},parts:[{label:"Pagado por contribuyentes de 2024",amount:"$48 M",tone:"ok"},{label:"Trasladado a contribuyentes futuros",amount:"$4 M",tone:"no"}]},steps:["Los residentes de 2024 recibieron servicios por $52 M.","Solo aportaron $48 M. Faltaron $4 M.","Esos $4 M se pagarán con impuestos de años futuros, más intereses.","Quien los pague en 2031 no recibió el servicio de 2024."],answer:"Se rompió la <em>equidad entre periodos</em>. Ojo: los activos del condado pueden superar sus pasivos y aun así estar roto — la pregunta es solo si los recursos del año pagaron los servicios del año."},"a3-0":{title:"Tres cartas en el mismo escritorio",setup:"La contadora de Valle Verde recibe consultas de tres entidades el mismo día. ¿Qué tablero le toca a cada una?",viz:{v:"ledger",cols:["Entidad","Tablero"],rows:[{cells:["Condado de Valle Verde","GASB"],tone:"seal"},{cells:["Ferretería La Sierra, S.A.","FASB"],tone:"plain"},{cells:["Servicio de Parques Nacionales","FASAB"],tone:"plain"}]},steps:["La pregunta nunca es qué dice la norma, sino <em>qué naturaleza tiene la entidad</em>.","El condado es un gobierno local. Le toca el GASB.","La ferretería es una empresa. Le toca el FASB.","El Servicio de Parques es una agencia federal. Le toca el FASAB."],answer:"Tres entidades, tres tableros, y ninguna puede elegir. La Regla 203 del AICPA designa a los tres cuerpos y la naturaleza de la entidad decide cuál aplica."},"a3-1":{title:"De dónde sale el dinero del GASB",setup:"Un residente pregunta si el GASB trabaja para el gobierno. Sigue el hilo del financiamiento.",viz:{v:"flow",nodes:[{label:"Financial Accounting Foundation",sub:"nombra a los miembros del GASB y del FASB",tone:"seal"},{label:"Dodd-Frank (2010)",sub:"ordenó crear una cuota de apoyo para el GASB",tone:"plain"},{label:"FINRA la establece en 2012",sub:"la cobra a las firmas que reportan valores municipales",tone:"plain"},{label:"Resultado: no depende de ningún gobierno",sub:"independent standards-setting board in the private sector",tone:"ok"}]},steps:["El GASB se formó en 1984 y opera bajo la Financial Accounting Foundation, que nombra a sus miembros.","La misma fundación supervisa al FASB. Son cuerpos <em>paralelos</em>, no uno subordinado al otro.","Su dinero viene de una cuota sobre operaciones de valores municipales, no del presupuesto público.","El FASB se financia parecido, con una cuota sobre emisiones corporativas creada por Sarbanes-Oxley."],answer:"No trabaja para el gobierno. Al no depender de ninguna organización ni gobierno en particular, se le describe como un cuerpo normativo independiente del sector privado."},"a3-2":{title:"Dos hospitales en la misma avenida",setup:"El Hospital General de Valle Verde lo opera el condado. El Hospital San Lucas es una asociación privada sin fines de lucro. Los dos son NFP.",viz:{v:"ledger",cols:["Hospital","Naturaleza","Tablero"],rows:[{cells:["General de Valle Verde","gubernamental","GASB"],tone:"seal"},{cells:["San Lucas","privado","FASB"],tone:"plain"}]},steps:["Los dos son sin fines de lucro, así que «ser NFP» no decide nada por sí solo.","El General lo opera el condado: es una NFP <em>gubernamental</em>.","San Lucas es independiente de cualquier gobierno: es una NFP privada.","Ninguno de los dos consejos directivos puede votar para cambiar de tablero."],answer:"El General sigue al GASB y San Lucas al FASB. La autoridad sobre las NFP está partida, y lo que decide es si la entidad es gubernamental — no lo que prefiera su administración."},"a3-3":{title:"Quién paga por las normas que sigues",setup:"Valle Verde emite bonos municipales por $20 000 000. Una casa de bolsa reporta las operaciones al MSRB.",viz:{v:"flow",nodes:[{label:"El condado emite bonos municipales",sub:"$20 000 000",tone:"plain"},{label:"Las firmas reportan las operaciones",sub:"al Municipal Securities Rule-Making Board",tone:"plain"},{label:"FINRA les cobra la cuota de apoyo",sub:"establecida en febrero de 2012",tone:"seal"},{label:"Con eso se financia el GASB",sub:"que fija las normas que el condado debe seguir",tone:"ok"}]},steps:["La Dodd-Frank de 2010 ordenó crear una cuota de apoyo contable para el GASB.","FINRA la estableció en febrero de 2012 y la cobra a las firmas que reportan operaciones de valores municipales.","Así el GASB no depende de cuotas voluntarias de los gobiernos que regula.","El FASB se sostiene igual, con la cuota sobre emisiones corporativas de Sarbanes-Oxley."],answer:"El mercado de bonos municipales financia al normador. Esa independencia de recursos es la razón de que a ambos se les llame boards independientes del sector privado."},"a4-0":{title:"Dos ciudades, dos publicaciones",setup:"San Ramón publica solo lo mínimo obligatorio. Valle Verde publica su informe anual completo. Las dos cumplen la norma.",viz:{v:"ledger",cols:["Contenido","Mínimo","Informe completo"],rows:[{cells:["MD&A","Sí","Sí"],tone:"seal"},{cells:["Estados básicos y notas","Sí","Sí"],tone:"seal"},{cells:["RSI distinta del MD&A","Sí","Sí"],tone:"seal"},{cells:["Carta de transmisión","No","Sí"]},{cells:["Informe del auditor","No","Sí"]},{cells:["Sección estadística","No","Sí"]}]},steps:["El mínimo obligatorio lo fija el GASB y es corto: MD&A, estados básicos con notas, y RSI.","El informe anual completo <em>no es obligatorio</em>, pero casi todos lo preparan como registro público.","Todo lo que trae el mínimo está también dentro del informe completo.","San Ramón cumple la norma publicando menos. No está incumpliendo nada."],answer:"El mínimo vive <em>dentro</em> del informe completo. Confundir uno con otro es el error más común del capítulo: uno es obligatorio y pequeño, el otro voluntario y grande."},"a4-1":{title:"La lista de verificación del contador",setup:"La contadora de San Ramón arma el paquete mínimo. Va tachando lo que la norma exige.",viz:{v:"ledger",cols:["Pieza","¿Obligatoria?"],rows:[{cells:["MD&A","Sí · es RSI"],tone:"ok"},{cells:["Estados de todo el gobierno","Sí"],tone:"ok"},{cells:["Estados por fondos","Sí"],tone:"ok"},{cells:["Notas a los estados","Sí · parte integral"],tone:"ok"},{cells:["Otra RSI distinta del MD&A","Sí"],tone:"ok"},{cells:["Combining statements","No"],tone:"no"}]},steps:["El MD&A abre el paquete: narrativa legible sobre los estados y el año frente al anterior.","Los estados básicos son <em>dos categorías</em>, no una: de todo el gobierno y por fondos.","Las notas no son un anexo opcional: son <em>parte integral</em> de los estados.","Los combining statements dan detalle de fondos no mayores, pero van más allá del mínimo."],answer:"El paquete mínimo son cuatro piezas: MD&A, estados básicos (de todo el gobierno y por fondos), notas y RSI distinta del MD&A. Nada más."},"a4-2":{title:"Tres documentos buscando su sección",setup:"Sobre el escritorio hay tres piezas del informe de Valle Verde. ¿En qué sección va cada una?",viz:{v:"ledger",cols:["Documento","Sección"],rows:[{cells:["Carta del director financiero a la comisión","Introductoria"],tone:"seal"},{cells:["Opinión del auditor independiente","Financiera"],tone:"ok"},{cells:["Tabla de deuda por habitante, 10 años","Estadística"],tone:"plain"}]},steps:["La carta de transmisión suena financiera, pero es de presentación: va en la <em>introductoria</em>.","La opinión del auditor sí es financiera, y encabeza esa sección.","La tabla de diez años es una tendencia, no un estado: va en la <em>estadística</em>.","De estas tres, solo la opinión del auditor está en la sección que contiene el mínimo obligatorio — pero ella misma no forma parte del mínimo."],answer:"Introductoria, financiera y estadística. La carta de transmisión es la que más se coloca mal, justamente porque suena a algo financiero."},"a4-3":{title:"Dos informes del mismo condado",setup:"En el archivo de Valle Verde hay un informe de 2018 y otro de 2024. Las portadas no dicen lo mismo.",viz:{v:"ledger",cols:["Año","Título en la portada","Contenido"],rows:[{cells:["2018","Comprehensive Annual Financial Report","tres secciones"],tone:"plain"},{cells:["2024","Annual Comprehensive Financial Report","tres secciones"],tone:"seal"}]},steps:["Las palabras están en distinto orden: <em>comprehensive annual</em> contra <em>annual comprehensive</em>.","El cambio viene del <em>Statement No. 98</em> del GASB, emitido en 2021.","La razón no fue técnica: la sigla anterior se pronuncia como un insulto racial en inglés sudafricano.","El contenido no cambió: las mismas tres secciones, el mismo mínimo adentro."],answer:"Es el mismo documento con otro nombre. Reconoce los dos términos: tu libro de 2019 dice CAFR y todo el material actual dice ACFR."},"a4-4":{title:"Un condado, dos cifras de resultado",setup:"Valle Verde cierra 2024. El estado por fondos y el de todo el gobierno reportan cifras distintas para el mismo año.",viz:{v:"ledger",cols:["Estado","Resultado del año","Responde por"],rows:[{cells:["Por fondos gubernamentales","+$1,2 M","rendición fiscal"],tone:"seal"},{cells:["De todo el gobierno","−$3,4 M","rendición operativa"],tone:"plain"}]},steps:["Abajo se miden solo recursos financieros corrientes: entró más efectivo del que salió, +$1,2 M.","Arriba se miden todos los recursos: se reconoció depreciación y el aumento de la deuda de pensiones.","Ninguna de las dos está mal. Miden cosas distintas con enfoques distintos.","Por eso el GASB obliga a conciliar las dos cifras: la diferencia debe poder explicarse línea por línea."],answer:"Dos juegos de estados porque hay dos preguntas. El fondo dice si cumplió el año; el de todo el gobierno, si el condado está mejor o peor que antes."}},h1={"b1-0":{title:"Cuatro actividades de un martes cualquiera",setup:"Clasifica cada actividad del condado en una de las tres categorías.",viz:{v:"ledger",cols:["Actividad","Categoría"],rows:[{cells:["Patrullaje del sheriff","Gubernamental"],tone:"seal"},{cells:["Planta de agua potable","Tipo negocio"],tone:"plain"},{cells:["Impuestos cobrados para el distrito escolar","Fiduciaria"],tone:"no"},{cells:["Fondo de pensiones de los empleados","Fiduciaria"],tone:"no"}]},steps:["El patrullaje se paga con impuestos generales y no cobra al usuario: gubernamental.","La planta de agua cobra por metro cúbico y busca cubrir su costo: tipo negocio.","Los impuestos del distrito escolar <em>nunca son del condado</em>: solo los cobra y los entrega.","Las pensiones son de los empleados, no del condado. También son de terceros."],answer:"Una gubernamental, una tipo negocio y dos fiduciarias. La prueba fiduciaria es si el recurso beneficia a un tercero; si apoya los programas del propio condado, es gubernamental."},"b1-1":{title:"Leer el statement of net position",setup:"Un extracto del estado de todo el gobierno de Valle Verde, en miles.",viz:{v:"ledger",cols:["Concepto","Gubernam.","Tipo negocio"],rows:[{cells:["Activos","412 800","186 400"]},{cells:["Deferred outflows","9 600","2 100"]},{cells:["Pasivos","(238 500)","(97 300)"]},{cells:["Deferred inflows","(6 200)","(1 400)"]},{cells:["<b>Net position</b>","<b>177 700</b>","<b>89 800</b>"],tone:"seal"}]},steps:["Dos columnas separadas: actividades gubernamentales y tipo negocio. No se mezclan.","Aparecen dos elementos que una empresa no tiene: <em>deferred outflows</em> y <em>deferred inflows</em> de recursos.","No son activos ni pasivos: son consumos o adquisiciones que corresponden a un periodo futuro.","Net position = activos + deferred outflows − pasivos − deferred inflows."],answer:"Se lee como un balance, pero con cuatro elementos en vez de dos y con las actividades separadas por columna. Y el net position se reporta en tres partes: inversión neta en capital, restringido y no restringido."},"b1-2":{title:"El taller de flotilla que cambia de columna",setup:"El taller de mantenimiento de Valle Verde es un internal service fund. Factura $4 200 000 al año. ¿Dónde aparece en los estados de todo el gobierno?",viz:{v:"split",whole:{label:"Facturación del taller",amount:"$4,2 M"},parts:[{label:"A departamentos gubernamentales",amount:"$3,8 M · 90 %",tone:"seal"},{label:"Al fondo de agua (enterprise)",amount:"$0,4 M · 10 %",tone:"plain"}]},steps:["Abajo, en los estados por fondos, el taller es un fondo <em>propietario</em>. Eso no está en duda.","Arriba hay que decidir columna, y la regla mira a quién sirve predominantemente.","El 90 % de su facturación va a departamentos gubernamentales.","Así que arriba se reporta dentro de <em>actividades gubernamentales</em>, no tipo negocio."],answer:"Propietario abajo, gubernamental arriba. Si el reparto fuera al revés y sirviera sobre todo a fondos enterprise, subiría a la columna tipo negocio."},"b1-3":{title:"Ochenta millones que no aparecen arriba",setup:"El fondo de pensiones de los empleados de Valle Verde tiene $80 000 000 en activos. El condado los administra.",viz:{v:"ledger",cols:["Estado","¿Aparecen los $80 M?"],rows:[{cells:["Statement of net position (todo el gobierno)","No"],tone:"no"},{cells:["Statement of activities (todo el gobierno)","No"],tone:"no"},{cells:["Statement of fiduciary net position","Sí"],tone:"ok"},{cells:["Statement of changes in fiduciary net position","Sí"],tone:"ok"}]},steps:["El condado <em>controla</em> esos activos: decide inversiones y firma cheques.","Pero no puede usarlos para pagar policías, calles ni nada de sus programas.","Como no pueden financiar los programas del gobierno, el GASB los excluye de arriba.","Aparecen solo en los dos estados fiduciarios, ambos con recursos económicos y devengado."],answer:"Controlar no es lo mismo que poder usar. No existe una columna fiduciaria en los estados de todo el gobierno — esa es la trampa habitual."},"b1-4":{title:"Por qué $12 M no es $95 M",setup:"El balance de fondos gubernamentales de Valle Verde cierra con $12 000 000 de fund balance. El net position de actividades gubernamentales es de $95 000 000.",viz:{v:"ledger",cols:["Partida","Miles"],rows:[{cells:["Total fund balances · fondos gubernamentales","12 000"],tone:"seal"},{cells:["+ Activos de capital, netos","148 000"],tone:"ok"},{cells:["− Deuda a largo plazo","(61 000)"],tone:"no"},{cells:["− Otros ajustes","(4 000)"],tone:"no"},{cells:["<b>= Net position · actividades gubernam.</b>","<b>95 000</b>"],tone:"seal"}]},steps:["Abajo no se reportan activos de capital: no sirven para pagar obligaciones del periodo.","Al subir, esos $148 M de activos netos <em>sí</em> entran.","Abajo tampoco se reporta la deuda a largo plazo. Al subir, se resta.","La diferencia entre $12 M y $95 M queda explicada línea por línea."],answer:"Es la <em>conciliación</em> que el GASB exige. Puede ir al pie del balance o como cédula aparte; prepararla se ve en el capítulo 9."},"b2-0":{title:"Un donativo que obliga a abrir un fondo",setup:"Una vecina dona $500 000 a Valle Verde con una condición escrita: solo pueden usarse para operar la biblioteca.",viz:{v:"ledger",cols:["El fondo de biblioteca","Monto"],rows:[{cells:["Efectivo","$500 000"]},{cells:["Pasivos","$0"]},{cells:["<b>Fund balance</b>","<b>$500 000</b>"],tone:"seal"}]},steps:["Si el dinero entrara al General Fund, se mezclaría con recursos sin restricción.","Entonces nadie podría demostrar que se usó solo en la biblioteca.","Por eso se abre un fondo: una entidad fiscal <em>y</em> contable con cuentas que cuadran solas.","Tiene sus propios recursos, sus propios pasivos y podría preparar estados por separado."],answer:"Es un <em>special revenue fund</em>. Los fondos existen justamente para separar lo restringido de lo no restringido — pero el GASB pide abrir solo el mínimo necesario."},"b2-1":{title:"Cuatro cheques, cuatro fondos gubernamentales",setup:"Valle Verde firma cuatro pagos el mismo día. Cada uno vive en un fondo distinto.",viz:{v:"ledger",cols:["Pago","Fondo"],rows:[{cells:["Nómina de la oficina del administrador","General Fund"],tone:"seal"},{cells:["Bacheo pagado con el impuesto a la gasolina","Special revenue"],tone:"plain"},{cells:["Intereses de los bonos de 2019","Debt service"],tone:"plain"},{cells:["Anticipo al constructor del nuevo juzgado","Capital projects"],tone:"plain"}]},steps:["La nómina administrativa no está obligada a ir a otro lado: General Fund, por defecto.","El impuesto a la gasolina está restringido a calles, así que necesita su propio fondo.","Los intereses de deuda general a largo plazo van al fondo de servicio de deuda.","La construcción de un activo de larga vida va al fondo de proyectos de capital."],answer:"Cuatro de los cinco tipos gubernamentales. Falta el <em>permanent fund</em>, que solo aparece cuando hay una dotación cuyo principal se preserva."},"b2-2":{title:"La alberca y el taller",setup:"Valle Verde opera una alberca municipal que cobra $30 la entrada, y un taller que repara los vehículos del propio condado.",viz:{v:"ledger",cols:["Operación","Le vende a","Tipo"],rows:[{cells:["Alberca municipal","el público","Enterprise"],tone:"seal"},{cells:["Taller de flotilla","departamentos del condado","Internal service"],tone:"plain"}]},steps:["Los dos son propietarios: cobran por lo que hacen y usan devengado pleno.","La única pregunta que los separa es <em>a quién le venden</em>.","La alberca vende al público: enterprise.","El taller cobra a departamentos del mismo condado a costo reembolsable: internal service."],answer:"Misma categoría, distinto tipo. Y ojo: el GASB <em>obliga</em> a usar enterprise si la deuda se garantiza con los ingresos de la actividad, si la ley exige recuperar costos con tarifas, o si la política de precios está diseñada para recuperarlos."},"b2-3":{title:"Dos fideicomisos que parecen iguales",setup:"Valle Verde administra dos dotaciones de $1 000 000 cada una. El principal se preserva en ambas; solo cambia quién recibe los rendimientos.",viz:{v:"ledger",cols:["Dotación","Los rendimientos van a","Fondo"],rows:[{cells:["Fondo Ramírez","mantener el parque municipal","Permanent · gubernamental"],tone:"seal"},{cells:["Fondo Ortega","becas para hijos de bomberos caídos","Private-purpose trust · fiduciario"],tone:"no"}]},steps:["Las dos preservan el principal a perpetuidad. Eso no las distingue.","Los rendimientos del Fondo Ramírez mantienen un parque: beneficia al público en general.","Los del Fondo Ortega pagan becas a personas concretas: beneficia a particulares.","Beneficio público → permanent fund, que es <em>gubernamental</em>. Beneficio privado → fiduciario."],answer:"Estructura idéntica, categorías distintas. La pregunta que decide es a quién benefician los rendimientos, no cómo está armado el fideicomiso."},"b3-0":{title:"El mismo predial, dos fechas de cobro",setup:"Valle Verde cierra su año el 31 de diciembre de 2024. Tiene $900 000 de predial por cobrar. La política del condado son 60 días.",viz:{v:"ledger",cols:["Se cobra el","Días tras el cierre","¿Ingreso de 2024?"],rows:[{cells:["14 de febrero de 2025","45","Sí"],tone:"ok"},{cells:["20 de abril de 2025","110","No"],tone:"no"}]},steps:["Bajo devengado modificado, el ingreso necesita dos cosas: ser <em>medible</em> y estar <em>disponible</em>.","Medible lo es en ambos casos: son $900 000 ya determinados.","Disponible significa cobrable a tiempo para pagar obligaciones del periodo.","Los cobrados a 45 días entran en 2024. Los de 110 días, no: se reconocerán después."],answer:"Solo lo cobrado dentro de la ventana es ingreso de 2024. Para el impuesto predial el GASB fija <em>60 días obligatorios</em>; en los demás ingresos cada gobierno define su plazo, entre 30 días y un año."},"b3-1":{title:"Lo que no cabe en el balance del fondo",setup:"El fondo de proyectos de capital de Valle Verde construyó un juzgado de $8 000 000, financiado con un bono de $5 000 000 a 20 años.",viz:{v:"ledger",cols:["Partida","Balance del fondo","Todo el gobierno"],rows:[{cells:["Efectivo remanente","Sí","Sí"],tone:"ok"},{cells:["Edificio del juzgado · $8 M","No","Sí"],tone:"no"},{cells:["Bono a 20 años · $5 M","No","Sí"],tone:"no"}]},steps:["El enfoque del fondo es de recursos financieros <em>corrientes</em>.","El edificio no se puede usar para pagar obligaciones del periodo, así que no entra como activo.","El bono no hay que pagarlo este periodo, así que tampoco entra como pasivo.","Los dos sí aparecen arriba, en la columna de actividades gubernamentales."],answer:"El balance del fondo muestra casi puro efectivo y cuentas de corto plazo. No es que se hayan omitido: se reportan con el otro enfoque, en el otro estado."},"b3-2":{title:"Un camión de basura, dos cifras",setup:"Valle Verde compra un camión de basura de $240 000 en efectivo. Vida útil: 8 años, sin valor residual.",viz:{v:"ledger",cols:["Año","En el fondo","En todo el gobierno"],rows:[{cells:["Año 1","$240 000","$30 000"],tone:"seal"},{cells:["Año 2","$0","$30 000"]},{cells:["Años 3 a 8","$0","$30 000 c/u"]},{cells:["<b>Total 8 años</b>","<b>$240 000</b>","<b>$240 000</b>"],tone:"ok"}]},steps:["En el fondo se registra un <em>expenditure</em> de $240 000 el año 1: salió todo el recurso corriente.","Arriba se registra un activo, y el <em>expense</em> es la depreciación: $30 000 al año.","El año 1 las dos cifras difieren en $210 000.","A ocho años suman lo mismo. Lo que cambia es <em>cuándo</em> se reconoce el costo."],answer:"Expenditure mide el recurso que salió este periodo; expense mide el costo consumido. Misma transacción, dos preguntas, y la conciliación explica la diferencia."},"b3-3":{title:"Poner precio al metro cúbico de agua",setup:"El fondo de agua de Valle Verde necesita fijar tarifa. Sirvió 2 000 000 de metros cúbicos este año.",viz:{v:"split",whole:{label:"Costo completo del servicio",amount:"$5 400 000"},parts:[{label:"Operación: sueldos, químicos, energía",amount:"$3 900 000",tone:"plain"},{label:"Depreciación de planta y red",amount:"$1 100 000",tone:"seal"},{label:"Intereses de la deuda",amount:"$400 000",tone:"plain"}]},steps:["Con devengado modificado no vería la depreciación: solo el efectivo que salió este año.","Sin esos $1 100 000, el costo parecería de $4 300 000 y la tarifa saldría baja.","La red se desgasta aunque no salga efectivo, y hay que reponerla algún día.","Costo completo entre 2 000 000 de m³ da $2,70 por metro cúbico."],answer:"Los fondos propietarios usan recursos económicos y devengado por una razón práctica: sin el costo completo, incluida la depreciación, no se puede fijar tarifa ni decidir si conviene prestar el servicio o contratarlo fuera."},"b4-0":{title:"Lo primero que se aparta",setup:"El General Fund de Valle Verde cierra con $3 000 000 de fund balance. La contadora empieza a clasificarlo.",viz:{v:"split",whole:{label:"Fund balance del General Fund",amount:"$3 000 000"},parts:[{label:"Inventario de almacén",amount:"$22 000",tone:"seal"},{label:"Seguros pagados por anticipado",amount:"$464 000",tone:"seal"},{label:"Queda por clasificar",amount:"$2 514 000",tone:"plain"}]},steps:["La clasificación se hace en orden, y lo primero es apartar lo <em>no gastable</em>.","El inventario es un bien físico: no está en forma de poder gastarse.","El seguro anticipado ya se pagó: tampoco es un recurso disponible para gastar.","Los $2 514 000 restantes sí son gastables, y ahora se clasifican según quién puso el candado."],answer:"$486 000 son <em>nonspendable</em>. La misma lógica aplica al principal de una dotación permanente, que es no gastable por ley aunque sea dinero."},"b4-1":{title:"Tres candados, tres dueños",setup:"Sobre los $2 514 000 restantes hay tres restricciones distintas.",viz:{v:"ledger",cols:["Monto","Quién puso el candado","Clasificación"],rows:[{cells:["$250 000","el gobierno federal (subvención)","Restricted"],tone:"seal"},{cells:["$1 000 000","la comisión, por ordenanza","Committed"],tone:"ok"},{cells:["$100 000","la administradora del condado","Assigned"],tone:"plain"}]},steps:["Pregunta única: ¿quién impuso la restricción y qué se necesita para quitarla?","La subvención federal viene de <em>afuera</em>. Solo el otorgante puede liberarla: restricted.","La ordenanza la puso el propio condado al máximo nivel y por acción formal: committed.","La administradora tiene autoridad delegada pero no hubo acción formal: assigned."],answer:"Externo → restricted. Interno con acción formal → committed. Interno sin acción formal → assigned. El monto no importa: importa el origen del candado."},"b4-2":{title:"Dos ordenanzas que no son lo mismo",setup:"La comisión de Valle Verde aprobó dos ordenanzas. Las dos apartan dinero, pero se clasifican distinto.",viz:{v:"flow",nodes:[{label:"Ordenanza A · crea un impuesto",sub:"grava 0,5 % de ventas y lo destina a desarrollo económico",tone:"seal"},{label:"¿Puede la comisión usarlo en otra cosa?",sub:"No: el componente de ingreso lo impide",tone:"no"},{label:"Ordenanza B · aparta una reserva",sub:"destina $1 000 000 de recursos existentes a emergencias",tone:"ok"},{label:"¿Puede la comisión usarlo en otra cosa?",sub:"Sí, revirtiendo la ordenanza",tone:"ok"}]},steps:["Las dos son acciones formales del máximo nivel, así que parecen ambas <em>committed</em>.","La ordenanza A es <em>legislación habilitante</em>: autoriza recaudar un ingreso <em>para un fin restringido</em>.","Ese componente de ingreso impide usar el recurso en otra cosa, aunque la comisión quisiera.","La ordenanza B solo aparta recursos que ya existían. Basta revertirla para liberarlos."],answer:"La A produce saldo <em>restricted</em>; la B, <em>committed</em>. La prueba rápida: si basta con que el mismo cuerpo vuelva a votar, es committed."},"b4-3":{title:"El cierre completo de dos fondos",setup:"Valle Verde clasifica el residuo del General Fund y el de un special revenue fund que quedó sin restricciones.",viz:{v:"ledger",cols:["Fondo","Residuo","Clasificación"],rows:[{cells:["General Fund","$1 164 000","Unassigned"],tone:"ok"},{cells:["Special revenue (biblioteca)","$50 000","Assigned"],tone:"seal"},{cells:["Capital projects (sobregirado)","−$80 000","Unassigned negativo"],tone:"no"}]},steps:["En el General Fund, lo que sobra tras clasificar todo lo demás es <em>unassigned</em>.","Es el único fondo que puede tener un unassigned <em>positivo</em>.","En el fondo de biblioteca, lo que sobra sin ser restringido ni comprometido se entiende <em>asignado</em>.","El fondo de capital gastó de más: reporta un unassigned <em>negativo</em>, que sí está permitido."],answer:"Dos reglas de signo: solo el General Fund puede tener unassigned positivo, y el GASB no permite saldos negativos en restricted, committed ni assigned."},"b5-0":{title:"Veintitrés fondos en dos columnas y media",setup:"Valle Verde usa 23 fondos gubernamentales. El balance impreso no tiene 23 columnas.",viz:{v:"split",whole:{label:"Fondos gubernamentales del condado",amount:"23"},parts:[{label:"General Fund · columna propia",amount:"1",tone:"seal"},{label:"Mayores por la prueba · columna propia",amount:"2",tone:"ok"},{label:"No mayores · una sola columna agregada",amount:"20",tone:"plain"}]},steps:["Al usuario no le interesan los 23: le interesan los que mueven dinero grande.","El General Fund siempre tiene columna, sin hacer cuentas.","Dos fondos más pasan la prueba aritmética y también reciben columna.","Los otros 20 se suman en una sola columna de «otros fondos gubernamentales»."],answer:"Cuatro columnas en total. La prueba aplica solo a fondos gubernamentales y enterprise: nunca a internal service ni a fiduciarios."},"b5-1":{title:"Un fondo que casi lo logra",setup:"El fondo de caminos de Valle Verde tiene $2 600 000 de activos. Los fondos gubernamentales suman $26 300 000 y, junto con los enterprise, $51 250 000.",viz:{v:"scale",label:"Activos del fondo de caminos",value:"$2 600 000",marks:[{label:"Valla 1 · 10 % de gubernamentales",value:"$2 630 000",pass:!1},{label:"Valla 2 · 5 % del combinado",value:"$2 562 500",pass:!0}]},steps:["10 % de $26 300 000 son $2 630 000. El fondo tiene $2 600 000: se queda corto por $30 000.","5 % de $51 250 000 son $2 562 500. Aquí sí pasa.","Pero las dos vallas hay que saltarlas con el <em>mismo</em> elemento.","Falló la primera con activos, así que por activos no califica. Habría que probar pasivos, ingresos y egresos por separado."],answer:"No es fondo mayor por activos. Por $30 000 — y por eso la prueba se hace con números y no a ojo."},"b5-2":{title:"El fondo pequeño que igual sale aparte",setup:"El fondo de emergencias sanitarias de Valle Verde movió $600 000, muy por debajo de los umbrales. La comisión quiere que se vea aparte.",viz:{v:"flow",nodes:[{label:"¿Pasa el 10 % y el 5 % con el mismo elemento?",sub:"No, en ningún elemento",tone:"no"},{label:"¿Lo considera el condado de importancia significativa?",sub:"Sí: es el fondo más consultado por los residentes",tone:"ok"},{label:"Se reporta como fondo mayor",sub:"por decisión, no por aritmética",tone:"seal"}]},steps:["Por números no califica: ni activos, ni pasivos, ni ingresos, ni egresos llegan.","Pero la norma añade un criterio de juicio a la prueba aritmética.","Cualquier fondo que el gobierno considere de importancia significativa para los usuarios puede reportarse como mayor.","La aritmética es un piso obligatorio, no un techo."],answer:"Sí puede reportarse como mayor. Y al revés: un fondo que cumplió ambos criterios el año pasado y este año no, puede seguir reportándose como mayor a la espera del año siguiente."},"b5-3":{title:"Qué fondos llevan cédula presupuestal",setup:"Valle Verde decide para cuáles de sus fondos debe publicar comparación de presupuesto contra real.",viz:{v:"ledger",cols:["Fondo","¿Presupuesto legal?","¿Lleva cédula?"],rows:[{cells:["General Fund","Sí","Sí"],tone:"ok"},{cells:["Caminos · special revenue mayor","Sí","Sí"],tone:"ok"},{cells:["Biblioteca · special revenue no mayor","Sí","No"],tone:"no"},{cells:["Proyectos de capital · mayor","No","No"],tone:"no"}]},steps:["La exigencia alcanza al General Fund y a cada <em>special revenue fund mayor</em>.","Caminos cumple las dos condiciones: es special revenue, es mayor y tiene presupuesto legalmente adoptado.","Biblioteca tiene presupuesto pero no es mayor: queda fuera.","Proyectos de capital es mayor pero no es special revenue: también queda fuera."],answer:"Solo dos cédulas. El GASB recomienda presentarlas como RSI justo después de las notas, aunque el gobierno puede convertirlas en un estado dentro de los básicos."}},g1={...m1,...h1},v1=(t,e)=>g1[`${t}-${e}`]??null;function Hh(t){var e,n,r="";if(typeof t=="string"||typeof t=="number")r+=t;else if(typeof t=="object")if(Array.isArray(t)){var o=t.length;for(e=0;e<o;e++)t[e]&&(n=Hh(t[e]))&&(r&&(r+=" "),r+=n)}else for(n in t)t[n]&&(r&&(r+=" "),r+=n);return r}function x1(){for(var t,e,n=0,r="",o=arguments.length;n<o;n++)(t=arguments[n])&&(e=Hh(t))&&(r&&(r+=" "),r+=e);return r}const y1=(t,e)=>{const n=new Array(t.length+e.length);for(let r=0;r<t.length;r++)n[r]=t[r];for(let r=0;r<e.length;r++)n[t.length+r]=e[r];return n},b1=(t,e)=>({classGroupId:t,validator:e}),Qh=(t=new Map,e=null,n)=>({nextPart:t,validators:e,classGroupId:n}),Qi="-",Cf=[],_1="arbitrary..",k1=t=>{const e=w1(t),{conflictingClassGroups:n,conflictingClassGroupModifiers:r}=t;return{getClassGroupId:i=>{if(i.startsWith("[")&&i.endsWith("]"))return S1(i);const a=i.split(Qi),l=a[0]===""&&a.length>1?1:0;return Yh(a,l,e)},getConflictingClassGroupIds:(i,a)=>{if(a){const l=r[i],c=n[i];return l?c?y1(c,l):l:c||Cf}return n[i]||Cf}}},Yh=(t,e,n)=>{if(t.length-e===0)return n.classGroupId;const o=t[e],s=n.nextPart.get(o);if(s){const c=Yh(t,e+1,s);if(c)return c}const i=n.validators;if(i===null)return;const a=e===0?t.join(Qi):t.slice(e).join(Qi),l=i.length;for(let c=0;c<l;c++){const d=i[c];if(d.validator(a))return d.classGroupId}},S1=t=>t.slice(1,-1).indexOf(":")===-1?v
