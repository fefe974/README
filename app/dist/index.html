 de otra manera",blocks:[{k:"p",t:"En una empresa, quien aporta recursos espera algo proporcional de vuelta. El cliente paga y se lleva el producto. El accionista invierte, espera dividendos y puede vender su parte."},{k:"p",t:'En un gobierno eso se rompe. El <span class="term">contribuyente<i>taxpayer</i></span> paga de forma <em>involuntaria</em>, ante una entidad que casi siempre tiene poder monopólico. No elige cuánto servicio recibe ni puede negarse a pagar.'},{k:"fig",id:"resources",cap:"La diferencia está en la flecha de retorno: sólida y proporcional en la empresa, punteada en el gobierno porque lo que recibes no depende de lo que aportaste."}]},{head:"Las tres características del FASB",blocks:[{k:"p",t:'El FASB fijó en su <span class="term">Concepts No. 4<i>SFAC 4</i></span> lo que separa a estas entidades de un negocio:'},{k:"p",t:"<em>(a)</em> Reciben recursos de quienes no esperan devolución ni beneficios proporcionales. <em>(b)</em> Su propósito operativo no es generar utilidad. <em>(c)</em> No hay intereses de propiedad que se puedan vender, transferir o redimir."}]},{head:"No existe una cifra que lo resuma",blocks:[{k:"p",t:"De aquí sale lo que ordena el resto del curso. Sin mercado competitivo, y sin relación entre lo que se paga y el servicio que se recibe, <em>no hay una cifra de utilidad neta que sirva para juzgar a un gobierno</em>."},{k:"fig",id:"noNetIncome",cap:"Una empresa comprime su desempeño en una sola cifra. Un gobierno no tiene esa cifra, y la rendición de cuentas ocupa su lugar."},{k:"note",head:"La pregunta que reemplaza a la utilidad",t:"¿Contra qué se juzga entonces a un gobierno? Contra si cumplió lo que el público decidió, y si usó bien lo que recibió. Ese hueco es el que llena la rendición de cuentas — el artículo II.",tone:"seal"}]},{head:"Dos tipos de gobierno",blocks:[{k:"p",t:'Los <span class="term">gobiernos de propósito general<i>general purpose</i></span> —estados, condados, municipios, <em>townships</em>— prestan una gama amplia de servicios.'},{k:"p",t:'Los de <span class="term">propósito especial<i>special purpose</i></span> —distritos escolares, universidades públicas, distritos de riego o de bomberos— prestan una sola función o unas pocas. Ambos pueden gravar y recaudar.'}]}],terms:[["General purpose government","Gobierno de propósito general: presta una amplia gama de servicios a sus residentes."],["Special purpose government","Gobierno de propósito especial: una sola función o unas pocas, con poder de gravar."],["Exchange transaction","Transacción de intercambio: cobro por un servicio prestado. Existe tanto en gobiernos como en empresas."]],quiz:[{q:"¿Cuál de los siguientes es un <em>special purpose government</em>?",src:"1–19, ítem 1",o:["El estado de Arkansas","El condado de Greene","Minneapolis Public Schools","La ciudad de Seattle"],a:2,w:"Un distrito escolar independiente presta una sola función: educación. Estados, condados y ciudades prestan una gama amplia, así que son de propósito general."},{q:"¿Qué afirmación es verdadera <em>tanto</em> para un gobierno <em>como</em> para una empresa?",src:"1–19, ítem 2",o:["Ausencia de motivo de lucro","Puede ganar ingresos mediante transacciones de intercambio","Ausencia de dueños","Los recursos los aportan quienes no se benefician directamente"],a:1,w:"Un gobierno también cobra por servicios: agua, permisos, transporte. Esas son <em>exchange transactions</em>, igual que una venta. Las otras tres describen solo al gobierno."},{q:"Según el FASB, ¿cuál <em>no</em> es una de las características que distinguen a estas entidades?",src:"SFAC 4, par. 6",o:["Recursos de quienes no esperan beneficios proporcionales","Propósito operativo distinto de generar utilidad","Ausencia de intereses de propiedad definidos","Prohibición legal de acumular superávit"],a:3,w:"No existe tal prohibición: un gobierno puede terminar el año con superávit. Las otras tres son literalmente las tres características de <em>Concepts No. 4</em>."}]},{id:"a2",roman:"II",concept:"Autoridad legal y rendición de cuentas",title:"La ley manda, y el reporte demuestra que se obedeció",en:"Legal authority and public accountability",standfirst:"En una empresa el presupuesto es un plan. En un gobierno es una ley. Esa sola diferencia explica buena parte del modelo contable.",steps:[{head:"El poder reside en el pueblo",blocks:[{k:"p",t:"El GASB describe el entorno de un gobierno señalando dónde reside el poder: <em>en manos del pueblo</em>."},{k:"p",t:"Los votantes lo delegan en funcionarios mediante elecciones. Una vez delegado queda repartido entre el ejecutivo, el legislativo y el judicial, y cada rama limita a las otras."},{k:"fig",id:"authority",cap:"Las restricciones llegan de arriba y de los lados. Cada capa impone requisitos que el reporte financiero tiene que poder demostrar."}]},{head:"Las restricciones llegan de todos lados",blocks:[{k:"p",t:"A esos límites internos se suman los externos: las leyes de jurisdicciones superiores, los actos del propio cuerpo legislativo y los acuerdos con acreedores."},{k:"p",t:"Todos crean requisitos únicos de rendición de cuentas financiera. Y quien recibe subvenciones de un nivel superior debe rendir cuentas a quien se las dio, además de a la ciudadanía."},{k:"p",t:"Por eso el GASB afirma que <em>la rendición de cuentas es la piedra angular de todo reporte financiero en el gobierno</em>."}]},{head:"Dos preguntas, no una",blocks:[{k:"p",t:"Esa piedra angular se parte en dos, y el examen las distingue sin piedad."},{k:"p",t:'La <span class="term">rendición de cuentas fiscal<i>fiscal accountability</i></span> pregunta si el gobierno cumplió lo que el público decidió sobre recaudar y gastar, normalmente dentro del año presupuestario.'},{k:"p",t:'La <span class="term">operativa<i>operational accountability</i></span> pregunta algo más amplio: si usó sus recursos de forma eficiente y eficaz para cumplir sus objetivos.'},{k:"fig",id:"accountability",cap:"Dos preguntas, dos horizontes. Cumplir la ley del presupuesto es de corto plazo; usar bien los recursos es de largo plazo."}]},{head:"Vivir dentro de sus medios",blocks:[{k:"p",t:'El GASB considera la <span class="term">equidad entre periodos<i>interperiod equity</i></span> parte esencial de la rendición de cuentas. En una frase: que el gobierno <em>viva dentro de sus medios</em>.'},{k:"p",t:"El reporte debe permitir evaluar si los recursos del periodo actual bastaron para pagar los servicios del periodo actual."},{k:"note",head:"Cuando se rompe, alguien más paga",t:"El exceso se vuelve carga de contribuyentes futuros que <em>nunca recibieron el beneficio</em>. Ojo: no pregunta si los ingresos superaron a los gastos, ni si los activos cubren los pasivos. Esas son las distractoras clásicas.",tone:"warn"},{k:"p",t:"La autoridad legal alcanza también a la auditoría. Las leyes varían de estado a estado, pero en todos los casos la opinión del auditor debe acompañar a los estados del informe."}]}],terms:[["Accountability","Rendición de cuentas: la piedra angular de todo reporte financiero gubernamental."],["Fiscal accountability","¿Cumplió el gobierno lo decidido por el público sobre recaudar y gastar en el periodo?"],["Operational accountability","¿Usó el gobierno sus recursos de forma eficiente y eficaz?"],["Interperiod equity","Equidad entre periodos: si los recursos del año actual pagaron los servicios del año actual."]],quiz:[{q:"El concepto de <em>interperiod equity</em> se refiere a si…",src:"1–19, ítem 5",o:["Los ingresos igualaron o superaron a los gastos del año","Los activos totales bastaron para cubrir los pasivos totales","Los ingresos del año presente bastaron para pagar los servicios del año presente","Los contribuyentes futuros recibirán el mismo nivel de servicios"],a:2,w:"Recursos del periodo actual contra servicios del periodo actual. La opción D suena parecida y es la trampa habitual: describe una consecuencia, no la definición."},{q:"James Black revisa el reporte de su ciudad porque le preocupa que <em>no esté usando bien sus recursos</em>. ¿Qué le interesa principalmente?",src:"1–19, ítem 4",o:["Fiscal accountability","Social accountability","Political accountability","Operational accountability"],a:3,w:"«Usar los recursos de forma eficiente y eficaz» es la definición de <em>operational accountability</em>. La fiscal es distinta: cumplir lo decidido sobre recaudar y gastar dentro del año presupuestario."},{q:"¿Por qué el presupuesto de un gobierno cambia el modelo contable, a diferencia del de una empresa?",src:"Concepto, LO 1-3",o:["Porque es más detallado que el de una empresa","Porque es una autorización legal cuyo cumplimiento el reporte debe poder demostrar","Porque lo aprueba un auditor externo","Porque se prepara con base devengada"],a:1,w:"El presupuesto es una autorización con fuerza de ley, no un plan interno. Demostrar que se cumplió es <em>fiscal accountability</em>, y es la razón de que los fondos gubernamentales usen un enfoque de corto plazo."}]},{id:"a3",roman:"III",concept:"Jurisdicción GASB vs. FASB",title:"Quién le fija las normas a quién",en:"GASB vs. FASB jurisdiction",standfirst:"La pregunta de examen casi nunca es qué dice la norma. Es qué tablero le toca a esta entidad — y no se puede elegir.",steps:[{head:"Tres tableros, no uno",blocks:[{k:"p",t:'La Regla 203 del Código de Conducta Profesional del AICPA designa tres cuerpos con autoridad para establecer los <span class="term">GAAP<i>generally accepted accounting principles</i></span>.'},{k:"p",t:"El <em>GASB</em> para gobiernos estatales y locales. El <em>FASB</em> para empresas y organizaciones sin fines de lucro. El <em>FASAB</em> para el gobierno federal y sus agencias."},{k:"fig",id:"jurisdiction",cap:"Sigue la flecha hacia arriba desde la entidad. La fila de abajo es donde se pierde la mayoría de los puntos."}]},{head:"Quién supervisa a quién",blocks:[{k:"p",t:'El GASB y el FASB son cuerpos <em>paralelos</em> bajo la <span class="term">Financial Accounting Foundation<i>FAF</i></span>, que nombra a sus miembros. El GASB se formó en 1984; el FASB, en 1973.'},{k:"p",t:"El FASAB nació por otra vía. Lo crearon en 1990 el <em>Comptroller General</em>, el director de la OMB y el secretario del Tesoro. Sus normas deben ser consistentes con las del GASB en lo posible."}]},{head:"La línea donde se pierde el punto",blocks:[{k:"p",t:"La autoridad sobre las organizaciones sin fines de lucro <em>está partida</em>, porque muchas son de naturaleza gubernamental."},{k:"note",head:"La regla, sin excepciones",t:"Si la NFP es gubernamental —universidad pública, hospital público— sigue al <em>GASB</em>. Si es independiente de un gobierno, sigue al <em>FASB</em>. No lo decide la administración ni el consejo: depende de lo que la entidad <em>es</em>.",tone:"warn"}]},{head:"Por qué se les llama independientes",blocks:[{k:"p",t:"La ley Sarbanes-Oxley impuso una cuota sobre emisiones de valores corporativos para sostener al FASB."},{k:"p",t:"La Dodd-Frank de 2010 ordenó una cuota equivalente para el GASB, y FINRA la estableció en 2012 sobre las firmas que reportan operaciones de valores municipales."},{k:"p",t:"Al no depender de ninguna organización ni gobierno en particular, a ambos se les describe como <em>independent standards-setting boards in the private sector</em>."}]}],terms:[["GASB","Normas para gobiernos estatales y locales, incluidas sus organizaciones sin fines de lucro. Formado en 1984."],["FASB","Normas para empresas y para NFP no gubernamentales. Formado en 1973."],["FASAB","Normas para el gobierno federal y sus agencias. Creado en 1990."],["FAF","Financial Accounting Foundation: supervisa y nombra a los miembros del GASB y del FASB."],["GAAP","Principios de contabilidad generalmente aceptados, según la Regla 203 del AICPA."]],quiz:[{q:"¿Qué afirmación sobre las fuentes de normas es <em>falsa</em>?",src:"1–19, ítem 3",o:["El GASB fija normas para todos los gobiernos estatales y locales","El FASB fija normas para todas las entidades empresariales y sin fines de lucro","El FASB y el GASB son administrados por la Financial Accounting Foundation","El FASAB fija normas para el gobierno federal y sus agencias"],a:1,w:"Es falsa por la palabra «todas». El FASB no cubre a las NFP gubernamentales —universidades y hospitales públicos— que siguen al GASB."},{q:"Un consejero del Beth House Museum (NFP no gubernamental) dice: «podemos elegir entre las reglas del FASB o las del GASB». ¿Tiene razón?",src:"1–4",o:["Sí; ambos están bajo la FAF, así que son intercambiables","Sí, si el consejo lo aprueba por mayoría","No; al ser una NFP no gubernamental le corresponde el FASB, sin opción","No; toda NFP sigue al GASB"],a:2,w:"No hay elección. El cuerpo normativo lo determina la naturaleza de la entidad. Si el museo fuera operado por una ciudad, sería GASB."},{q:"Asigna: <em>Department of Defense</em> · <em>Mayo Clinic</em> · <em>New York City</em>.",src:"1–21",o:["FASAB · FASB · GASB","GASB · FASB · FASAB","FASAB · GASB · GASB","FASB · FASB · GASB"],a:0,w:"Defensa es una agencia federal → FASAB. Mayo Clinic es una NFP privada → FASB. Nueva York es un gobierno local → GASB."},{q:"Una universidad pública estatal y una universidad privada. ¿Qué normas sigue cada una?",src:"1–21",o:["Ambas FASB","Ambas GASB","La pública GASB; la privada FASB","La pública FASAB; la privada FASB"],a:2,w:"La universidad pública es una NFP gubernamental → GASB. La privada es independiente de un gobierno → FASB. El FASAB solo cubre al gobierno federal."}]},{id:"a4",roman:"IV",concept:"Estructura del CAFR / ACFR",title:"Lo mínimo obligatorio, y el informe que lo contiene",en:"Basic CAFR / ACFR structure",standfirst:"Son dos cosas distintas y se confunden constantemente. Una es obligatoria y pequeña. La otra es voluntaria y mucho más grande.",steps:[{head:"Dos cosas que se confunden siempre",blocks:[{k:"p",t:"El GASB fija un <em>mínimo obligatorio</em> de reporte financiero externo. Por separado existe el informe anual completo, que <em>no es obligatorio</em> aunque casi todos los gobiernos lo preparan."},{k:"p",t:"El mínimo vive <em>dentro</em> del informe. Confundirlos es el error más común del capítulo."}]},{head:"Qué exige el mínimo",blocks:[{k:"p",t:'Cuatro cosas: el <span class="term">MD&amp;A<i>management’s discussion and analysis</i></span>, los estados básicos —de todo el gobierno y por fondos—, sus notas, y la <span class="term">RSI<i>required supplementary information</i></span> distinta del MD&amp;A.'},{k:"p",t:"El MD&amp;A es a la vez RSI y el centro del modelo: cuenta en forma narrativa y legible qué hay en los estados y cómo fue el año frente al anterior. Las notas son <em>parte integral</em> de los estados."}]},{head:"La anatomía del informe",blocks:[{k:"fig",id:"acfr",cap:"Léelo como una caja dentro de otra caja. Todo lo que queda fuera del corchete va más allá del mínimo."},{k:"p",t:"<em>Introductoria:</em> portada, índice, carta de transmisión y descripción del gobierno."},{k:"p",t:"<em>Financiera:</em> informe del auditor, MD&amp;A, estados básicos y notas, RSI, e información suplementaria como los <em>combining statements</em>."},{k:"p",t:"<em>Estadística:</em> datos demográficos y económicos, tendencias financieras, capacidad fiscal e información operativa."}]},{head:"CAFR pasó a llamarse ACFR",blocks:[{k:"note",head:"Tu libro dice CAFR; la norma vigente dice ACFR",t:'El texto, de 2019, dice <em>comprehensive annual financial report</em>. En 2021 el GASB lo renombró <span class="term">annual comprehensive financial report<i>ACFR</i></span> con su <em>Statement No. 98</em>, porque la sigla anterior suena como un insulto racial en inglés sudafricano.',tone:"seal"},{k:"p",t:"Es el mismo documento, con las mismas tres secciones y el mismo contenido. Reconoce los dos términos: verás CAFR en material anterior a 2021 y ACFR en todo lo actual."}]},{head:"Por qué hay dos juegos de estados",blocks:[{k:"p",t:"Cada juego responde a una de las dos preguntas del artículo II."},{k:"fig",id:"dual",cap:"Bajo devengado modificado los ingresos se reconocen cuando son medibles y están disponibles, y se registran expenditures —no expenses— cuando obligan recursos corrientes."},{k:"p",t:"Los de todo el gobierno usan lo mismo que una empresa —base devengada y recursos económicos— porque así se evalúa mejor la rendición de cuentas operativa."},{k:"p",t:"Los de fondos gubernamentales miran el corto plazo, que es lo que permite evaluar la fiscal. Nota: el GASB dice <em>net position</em> donde el FASB dice <em>net assets</em>; son lo mismo."}]}],terms:[["CAFR / ACFR","El informe anual completo. Renombrado de comprehensive a annual comprehensive por GASB 98 (2021). No es obligatorio."],["MD&A","Discusión y análisis de la administración: narrativa legible; es RSI y es el centro del modelo."],["RSI","Required supplementary information: obligatoria, fuera de los estados básicos."],["Government-wide statements","Agregados; base devengada; recursos económicos; responden por la rendición de cuentas operativa."],["Fund statements","Por fondos; los gubernamentales usan devengado modificado; responden por la rendición de cuentas fiscal."],["Modified accrual","Ingresos cuando son medibles y están disponibles; expenditures cuando obligan recursos corrientes."]],quiz:[{q:"¿Qué componentes forman el <em>mínimo requerido</em> de reporte financiero externo de propósito general?",src:"1–19, ítem 6",o:["Sección introductoria, sección financiera y sección estadística","MD&amp;A, estados de todo el gobierno, estados por fondos, notas y RSI","Carta del director financiero, estados del gobierno, notas y RSI","MD&amp;A, estados de todo el gobierno, notas y RSI"],a:1,w:"La opción A describe las secciones del <em>ACFR</em>, no el mínimo: esa es justamente la confusión que se busca. La D omite los estados por fondos, que sí son parte de los estados básicos."},{q:"La información útil para evaluar la <em>operational accountability</em> se reporta principalmente en…",src:"1–19, ítem 7",o:["Los estados por fondos","Los estados de todo el gobierno","La sección estadística","La carta de transmisión"],a:1,w:"Los estados de todo el gobierno usan base devengada y recursos económicos, que es lo que permite juzgar eficiencia y eficacia. Los estados por fondos sirven para la rendición de cuentas fiscal."},{q:"¿Cuál de estos <em>no</em> forma parte de la sección financiera?",src:"1–8 y 1–17",o:["El informe del auditor","El MD&amp;A","La carta de transmisión","Los combining and individual fund statements"],a:2,w:"La carta de transmisión va en la sección <em>introductoria</em>. Es la pieza que más se coloca mal, porque suena a algo financiero."},{q:"Bajo <em>modified accrual</em>, ¿cuándo se reconoce un ingreso?",src:"LO 1-4",o:["Cuando se gana, sin importar cuándo se cobra","Cuando es medible y está disponible para gastar","Cuando se recibe el efectivo, siempre","Cuando lo aprueba el presupuesto"],a:1,w:"«Medible y disponible» es la fórmula exacta. Del otro lado se registran <em>expenditures</em>, no <em>expenses</em>."},{q:"¿Qué cambió el <em>Statement No. 98</em> del GASB en 2021?",src:"GASB 98",o:["Eliminó la sección estadística del informe","Hizo obligatorio el informe anual completo","Renombró el CAFR como ACFR, sin cambiar su contenido","Sustituyó el devengado modificado por el devengado pleno"],a:2,w:"Solo el nombre: de <em>comprehensive annual financial report</em> a <em>annual comprehensive financial report</em>. Mismo documento, mismas secciones, mismo contenido."}]}],Cx=[{q:"Un ciudadano quiere saber si su ciudad <em>cumplió el presupuesto aprobado</em>. ¿Qué estados consulta y con qué base contable?",src:"Cruza los artículos II y IV",o:["Government-wide, base devengada","Estados por fondos gubernamentales, devengado modificado","La sección estadística del ACFR","La carta de transmisión"],a:1,w:"Cumplir lo aprobado dentro del año es <em>fiscal accountability</em> → estados por fondos → devengado modificado, con enfoque de recursos financieros corrientes."},{q:"La ciudad publicó solo el mínimo requerido, sin ACFR. ¿Qué <em>no</em> vas a encontrar?",src:"Artículo IV",o:["El MD&A","Los estados financieros básicos","La carta de transmisión y la sección estadística","Las notas"],a:2,w:"El mínimo es MD&amp;A + estados básicos + notas + RSI. La carta de transmisión y la sección estadística existen solo dentro del informe completo, que es voluntario."},{q:"El concejo pregunta si la ciudad «vivió dentro de sus medios». ¿Qué concepto invocan?",src:"Artículo II",o:["Operational accountability","Interperiod equity","Stewardship","Budgetary integrity"],a:1,w:"«Vivir dentro de sus medios» es la definición literal de <em>interperiod equity</em>. Si no se cumple, la diferencia la pagan contribuyentes futuros que no recibieron el servicio."},{q:"Un hospital operado por un condado prepara sus estados. ¿Qué normas sigue y por qué?",src:"Artículo III",o:["FASB, porque es una organización sin fines de lucro","GASB, porque es una NFP gubernamental","FASAB, porque recibe fondos federales","Puede elegir entre GASB y FASB"],a:1,w:"Ser sin fines de lucro no decide nada por sí solo. Lo que decide es si la entidad es gubernamental: al ser operada por un condado, sigue al GASB."},{q:"¿Por qué un gobierno no puede ser evaluado con una cifra de utilidad neta?",src:"Artículo I",o:["Porque la ley le prohíbe generar superávit","Porque no lleva contabilidad de costos","Porque no hay mercado competitivo ni relación entre lo pagado y el servicio recibido","Porque sus ingresos no son medibles"],a:2,w:"El contribuyente aporta de forma involuntaria ante un monopolio y no elige el nivel de servicio. Sin esa relación, ninguna cifra única resume el desempeño — y por eso la rendición de cuentas ocupa su lugar."},{q:"Tu fuente de 2019 dice «CAFR» y la circular del estado de 2024 dice «ACFR». ¿Qué concluyes?",src:"Artículo IV · GASB 98",o:["Son informes distintos con contenidos distintos","El ACFR reemplazó al CAFR y además añadió la sección estadística","Es el mismo informe; GASB 98 solo cambió el nombre en 2021","El CAFR es voluntario y el ACFR obligatorio"],a:2,w:"Mismo documento, mismas tres secciones, mismo contenido. Solo cambió el nombre. Verás ambos términos según la fecha del material."}],jx={id:"ch1",num:1,name:"Introducción al reporte de gobiernos y NFP",en:"Introduction to Accounting and Financial Reporting",caseTab:"Expediente · problemas 1–17 y 1–18",caseTitle:"El informe que nadie sabe leer",caseLede:["El concejo municipal te entrega el informe anual de la ciudad y el balance de una asociación sin fines de lucro, y hace una pregunta incómoda: <em>«¿esta ciudad vivió dentro de sus medios, y estas dos entidades siquiera se pueden comparar?»</em>","Para responder hacen falta cuatro cosas, y este capítulo es exactamente esas cuatro."],articles:Ex,capstoneLede:"Cuatro tareas, sin mini-clases y sin pistas antes de responder. Si te trabas, el glosario sigue ahí.",closing:"Ya puedes responder las cuatro preguntas del capítulo: por qué un gobierno no se mide con utilidad neta, de dónde viene su obligación de rendir cuentas, qué tablero normativo le toca a cada entidad, y qué contiene realmente un ACFR.",tasks:[{kind:"sort",title:"Arma el ACFR de la ciudad",src:"Problema 1–17",hint:"Toca un elemento, luego la sección donde va.",bins:[{code:"1",label:"Introductoria",eyebrow:"Sección 1"},{code:"2",label:"Financiera",eyebrow:"Sección 2"},{code:"3",label:"Estadística",eyebrow:"Sección 3"}],items:[["Carta de transmisión",0],["Portada e índice",0],["Descripción del gobierno",0],["Informe del auditor independiente",1],["MD&A",1],["Estados básicos y notas",1],["RSI distinta del MD&A",1],["Combining and individual fund statements",1],["Tablas demográficas y económicas",2],["Tendencias financieras",2],["Capacidad fiscal",2],["Información operativa",2]],note:"La carta de transmisión es introductoria; el informe del auditor es financiero. Esos dos son los que más se cambian de lugar."},{kind:"grid",title:"Gobierno, NFP privada y empresa",src:"Problema 1–18",hint:"Marca Y si la característica aplica a ese tipo de entidad, N si no. Toca de nuevo para alternar.",cols:["Gobierno","NFP privada","Empresa"],rows:[["Ausencia de intereses de propiedad que se puedan vender",["Y","Y","N"]],["Quien aporta recursos espera un beneficio proporcional",["N","N","Y"]],["Su desempeño global se resume en una cifra de net income",["N","N","Y"]],["Exige un MD&A como required supplementary information",["Y","N","N"]],["Prepara estados government-wide y estados por fondos",["Y","N","N"]],["Reporta net assets con y sin restricciones de donante",["N","Y","N"]],["Prepara un statement of activities",["Y","Y","N"]],["Sigue normas emitidas por el GASB",["Y","N","N"]]],note:"Mira la fila del statement of activities: lo preparan tanto el gobierno como la NFP. Ahí está el corazón del problema 1–18."},{kind:"sort",title:"¿Quién le fija las normas a quién?",src:"Problema 1–21",hint:"Toca la entidad, luego su cuerpo normativo.",bins:[{code:"G",label:"GASB",eyebrow:"G"},{code:"F",label:"FASB",eyebrow:"F"},{code:"FB",label:"FASAB",eyebrow:"FB"}],items:[["Una universidad estatal pública",0],["Department of Defense",2],["AICPA",1],["El condado donde vives",0],["Internal Revenue Service",2],["Mayo Clinic",1],["New York City",0],["American Cancer Society",1],["Metropolitan Washington Airports Authority",0],["The Metropolitan Museum of Art",1]],note:"La Metropolitan Washington Airports Authority es un cuerpo público creado por pacto interestatal → GASB. El AICPA y el Met son NFP privadas → FASB."},{kind:"quiz",title:"El caso completo",src:"Cruza los cuatro artículos",hint:"Seis preguntas que mezclan los cuatro conceptos.",questions:Cx}],glossary:[["Accountability","Rendición de cuentas","La piedra angular de todo reporte financiero gubernamental: justificar cómo se obtienen y se usan los recursos públicos.","II"],["ACFR / CAFR","Informe anual integral","El informe completo de tres secciones. No es obligatorio. Renombrado por GASB 98 en 2021; el contenido no cambió.","IV"],["Basic financial statements","Estados financieros básicos","Las dos categorías que prescribe el GASB —government-wide y fund— junto con sus notas, que son parte integral.","IV"],["Exchange transaction","Transacción de intercambio","Cobro por un servicio prestado. Ocurre tanto en gobiernos como en empresas, y por eso no sirve para distinguirlos.","I"],["FAF","Financial Accounting Foundation","Supervisa al GASB y al FASB, nombra a sus miembros y sostiene sus operaciones.","III"],["FASAB","Federal Accounting Standards Advisory Board","Creado en 1990 por el Comptroller General, el director de la OMB y el secretario del Tesoro. Cubre el gobierno federal.","III"],["FASB","Financial Accounting Standards Board","Formado en 1973. Normas para empresas y para NFP no gubernamentales.","III"],["Fiscal accountability","Rendición de cuentas fiscal","Si el gobierno cumplió lo decidido por el público sobre recaudar y gastar, normalmente dentro del año presupuestario.","II"],["GAAP","Principios de contabilidad generalmente aceptados","Establecidos por GASB, FASB y FASAB según la Regla 203 del Código de Conducta Profesional del AICPA.","III"],["GASB","Governmental Accounting Standards Board","Formado en 1984. Normas para gobiernos estatales y locales, incluidas sus NFP.","III"],["General purpose government","Gobierno de propósito general","Estados, condados, municipios y townships: prestan una amplia gama de servicios.","I"],["Government-wide statements","Estados de todo el gobierno","Vista agregada. Base devengada y recursos económicos. Responden por la rendición de cuentas operativa.","IV"],["Interperiod equity","Equidad entre periodos","Que el gobierno viva dentro de sus medios: si los recursos del año actual pagaron los servicios del año actual.","II"],["MD&A","Discusión y análisis de la administración","RSI narrativa y legible sobre el propósito de los estados básicos y la situación frente al año anterior.","IV"],["Modified accrual","Base devengada modificada","Ingresos cuando son medibles y están disponibles; expenditures cuando obligan recursos financieros corrientes.","IV"],["Net position / Net assets","Activo neto","El GASB dice net position; el FASB dice net assets. Son sustancialmente lo mismo.","IV"],["Operational accountability","Rendición de cuentas operativa","Si el gobierno usó sus recursos de forma eficiente y eficaz para cumplir sus objetivos operativos.","II"],["RSI","Información suplementaria requerida","Obligatoria y fuera de los estados básicos. El MD&A es RSI, y además se exige otra RSI distinta del MD&A.","IV"],["Special purpose government","Gobierno de propósito especial","Distritos escolares independientes, universidades públicas y distritos especiales: una función o unas pocas.","I"]]},Ax=[{id:"b1",roman:"I",concept:"El modelo integrado de reporte",title:"Dos juegos de estados que cuentan la misma historia",en:"The GASB integrated reporting model",standfirst:"El gobierno no elige entre reportar a largo o a corto plazo. Reporta las dos cosas, en dos juegos de estados que después tiene que conciliar entre sí.",steps:[{head:"Tres tipos de actividad",blocks:[{k:"p",t:"Casi todo gobierno de propósito general hace tres cosas distintas, y el modelo de reporte nace de esa división."},{k:"p",t:'Las <span class="term">actividades gubernamentales<i>governmental activities</i></span> son los servicios centrales: policía, bomberos, calles, parques, educación, y el soporte administrativo.'},{k:"p",t:'Las <span class="term">tipo negocio<i>business-type</i></span> cobran al usuario: agua, alcantarillado, transporte, estacionamientos, albercas. Las <span class="term">fiduciarias<i>fiduciary</i></span> son recursos de terceros que el gobierno solo custodia.'},{k:"fig",id:"activities",cap:"Solo se reportan como fiduciarias las relaciones de custodia o fideicomiso que benefician a terceros. Si la actividad apoya los programas del propio gobierno, es gubernamental."}]},{head:"El primer juego: todo el gobierno",blocks:[{k:"p",t:'Los <span class="term">estados de todo el gobierno<i>government-wide</i></span> son dos: el <em>statement of net position</em> y el <em>statement of activities</em>.'},{k:"p",t:"Usan <em>enfoque de recursos económicos y base devengada</em>, igual que una empresa. Presentan columnas separadas para actividades gubernamentales y tipo negocio, más un total del gobierno primario."},{k:"p",t:"Dos rarezas frente a una empresa: los gastos se reportan <em>por función o programa</em>, no por naturaleza; y el <em>net position</em> se parte en tres —inversión neta en activos de capital, restringido y no restringido—."}]},{head:"El segundo juego: por fondos",blocks:[{k:"p",t:"Además hay <em>tres</em> juegos de estados por fondos, uno por cada categoría: gubernamentales, propietarios y fiduciarios."},{k:"fig",id:"model",cap:"Las categorías de fondos corresponden a las tres actividades, con una excepción que se pregunta mucho: los internal service funds son fondos propietarios, pero al nivel de todo el gobierno casi siempre se reportan dentro de actividades gubernamentales."},{k:"p",t:"La razón: aunque operan como negocio, los internal service funds sirven sobre todo a departamentos del mismo gobierno, no al público. Si sirven principalmente a fondos enterprise, entonces sí van en la columna tipo negocio."}]},{head:"Lo fiduciario queda fuera de arriba",blocks:[{k:"note",head:"La regla que hay que fijar",t:"Los recursos fiduciarios <em>no pueden usarse para los programas del gobierno</em>. Por eso el GASB exige que se omitan de los estados de todo el gobierno y aparezcan <em>solo</em> en sus dos estados por fondos.",tone:"warn"},{k:"p",t:"Esos dos son el <em>statement of fiduciary net position</em> y el <em>statement of changes in fiduciary net position</em>. Ambos con recursos económicos y devengado."}]},{head:"Y por eso hay conciliación",blocks:[{k:"p",t:"La misma información de actividades gubernamentales aparece medida de dos maneras distintas. Eso confunde, y el GASB lo resuelve exigiendo conciliaciones."},{k:"p",t:"El total de <em>fund balances</em> del balance de fondos gubernamentales debe conciliarse con el <em>net position</em> de actividades gubernamentales. Lo mismo con el cambio del periodo entre ambos estados operativos."},{k:"p",t:"Puede ir al pie del propio estado o como cédula aparte. Por ahora basta con saber que es obligatoria: prepararla se ve en el capítulo 9."}]}],terms:[["Governmental activities","Servicios centrales: seguridad, obras públicas, cultura, educación y soporte administrativo."],["Business-type activities","Actividades que cobran al usuario y buscan autofinanciarse: agua, transporte, estacionamientos."],["Fiduciary activities","Recursos que el gobierno custodia para terceros. Se omiten de los estados de todo el gobierno."],["Statement of net position","El balance de todo el gobierno. Net position = activos + deferred outflows − pasivos − deferred inflows."],["Statement of activities","Estado operativo de todo el gobierno. Reporta gastos por función o programa, no por naturaleza."]],quiz:[{q:"¿Qué afirmación sobre los estados básicos de un gobierno estatal o local es correcta?",src:"2–16, ítem 2",o:["Los estados de todo el gobierno llevan columnas separadas para actividades gubernamentales y tipo negocio","Los estados por fondos llevan una columna por cada fondo mayor","Los fondos no mayores se agregan en una sola columna","Todas las anteriores"],a:3,w:"Las tres son correctas. Columnas por tipo de actividad arriba, columna por fondo mayor abajo, y una sola columna agregada para todos los no mayores."},{q:"Los activos y pasivos que el gobierno mantiene como custodio o fiduciario para terceros se reportan en…",src:"2–16, ítem 7",o:["La columna fiduciaria de los estados de todo el gobierno","Los estados por fondos fiduciarios","Ambos, de todo el gobierno y por fondos","Ninguno de los dos"],a:1,w:"Solo en los estados por fondos fiduciarios. Como esos recursos no pueden financiar los programas del gobierno, se omiten de los estados de todo el gobierno. No existe una columna fiduciaria arriba."},{q:"La información de un <em>internal service fund</em> se reporta en los estados por fondos propietarios y además en…",src:"2–16, ítem 9",o:["La columna de actividades gubernamentales","La columna de actividades tipo negocio","Una u otra, según a quién sirva predominantemente","Ninguna: se omite de los estados de todo el gobierno"],a:2,w:"Depende de a quién sirve. Como suele servir a departamentos del propio gobierno, casi siempre va en actividades gubernamentales; si sirve sobre todo a fondos enterprise, va en tipo negocio."}]},{id:"b2",roman:"II",concept:"Las tres categorías de fondos",title:"Once tipos de fondo, tres categorías, un solo criterio",en:"Fund categories: governmental, proprietary, fiduciary",standfirst:"El plan de cuentas de un condado está organizado por fondos. Saber en qué categoría cae cada uno es lo que te dice qué base contable aplicarle.",steps:[{head:"Qué es exactamente un fondo",blocks:[{k:"p",t:"En el gobierno, las exigencias legales y las de los GAAP con frecuencia chocan. El sistema contable tiene que poder satisfacer <em>las dos</em>. De esa tensión nacen los fondos."},{k:"p",t:'Un <span class="term">fondo<i>fund</i></span> es una entidad fiscal <em>y</em> contable, con un juego de cuentas que cuadra solo, que registra recursos y sus pasivos relacionados, segregados para una actividad u objetivo específico.'},{k:"p",t:"Es decir: tiene sus propios recursos, sus propios pasivos y sus propios registros, y podría preparar estados por separado. Se crean por contrato o subvención, por legislación habilitante, o por decisión del propio gobierno."},{k:"note",head:"Los mínimos posibles",t:"El GASB recomienda establecer <em>solo el número mínimo de fondos</em> necesario para cumplir la ley y administrar bien. Demasiados fondos crean complejidad inútil y administración ineficiente.",tone:"seal"}]},{head:"Categoría 1 · Fondos gubernamentales",blocks:[{k:"p",t:'Cinco tipos. Todo gobierno tiene <em>uno y solo uno</em> <span class="term">General Fund<i>fondo general</i></span>: es el fondo operativo principal, y ahí va todo lo que no esté obligado a ir en otro lado.'},{k:"p",t:"Los <em>special revenue funds</em> guardan ingresos restringidos o comprometidos para un propósito operativo concreto: una biblioteca, el mantenimiento de calles."},{k:"p",t:"Los <em>debt service funds</em> pagan principal e intereses de deuda general a largo plazo. Los <em>capital projects funds</em> registran la compra o construcción de activos de larga vida."},{k:"p",t:"Los <em>permanent funds</em> son dotaciones donde el principal se preserva a perpetuidad y los rendimientos apoyan un <em>propósito público</em>. Si los rendimientos benefician a particulares, no es permanent fund sino private-purpose trust."}]},{head:"Categoría 2 · Fondos propietarios",blocks:[{k:"p",t:"Dos tipos, y se distinguen por <em>a quién le venden</em>."},{k:"p",t:'Los <span class="term">internal service funds<i>servicios internos</i></span> sirven a departamentos del mismo gobierno a costo reembolsable: compras centralizadas, almacén, flotilla, procesamiento de datos, autoseguro.'},{k:"p",t:'Los <span class="term">enterprise funds<i>empresariales</i></span> venden al público. El GASB los <em>exige</em> si la deuda está garantizada solo por los ingresos de la actividad, si la ley obliga a recuperar los costos con tarifas, o si la política de precios está diseñada para recuperar costos.'}]},{head:"Categoría 3 · Fondos fiduciarios",blocks:[{k:"p",t:"Uno de custodia y tres de fideicomiso. Los <em>custodial funds</em> se usan cuando el gobierno solo administra activos de terceros — por ejemplo, impuestos cobrados por cuenta de otro gobierno."},{k:"p",t:"Para ser <em>trust fund</em> tiene que haber un acuerdo de fideicomiso, o tratarse de un plan de pensiones o beneficios post-empleo."},{k:"fig",id:"funds",cap:"Once tipos de fondo. La columna de la derecha es la que decide todo lo demás: la categoría determina el enfoque de medición y la base contable, que es el artículo III."},{k:"p",t:"Los <em>pension trust funds</em> guardan activos para el retiro de empleados. Los <em>investment trust funds</em> reportan la parte de participantes externos en el fondo de inversión del gobierno. Los <em>private-purpose trust funds</em> benefician a particulares, organizaciones u otros gobiernos."}]}],terms:[["Fund","Entidad fiscal y contable, con cuentas que cuadran solas, segregada para una actividad u objetivo."],["General Fund","El fondo operativo principal. Cada gobierno tiene uno y solo uno."],["Special revenue fund","Ingresos restringidos o comprometidos para un propósito operativo específico."],["Permanent fund","Dotación cuyo principal se preserva y cuyos rendimientos apoyan un propósito público."],["Internal service fund","Sirve a departamentos del mismo gobierno a costo reembolsable."],["Enterprise fund","Vende bienes o servicios al público a cambio de una tarifa."],["Custodial fund","El gobierno solo administra activos de terceros, sin fideicomiso."]],quiz:[{q:"¿Qué afirmación sobre la definición de un <em>fondo</em> es correcta?",src:"2–16, ítem 1",o:["Es una entidad fiscal diseñada para demostrar cumplimiento de disposiciones legales y contractuales","Es una entidad contable que permite reportar según GAAP sin verse restringida por lo legal","Es un mecanismo para contabilizar ingresos y gastos restringidos aparte de los no restringidos","Existe para llevar actividades donde no hay reglas ni restricciones específicas"],a:2,w:"La necesidad de separar recursos con restricciones legales o contractuales de los que no las tienen es exactamente lo que dio origen a los fondos. Un fondo es a la vez entidad fiscal y contable, y sirve para lo legal <em>y</em> para GAAP."},{q:"Una dotación cuyo principal se preserva y cuyos rendimientos pagan becas <em>a hijos de policías caídos</em> se registra en…",src:"2–19",o:["Un permanent fund","Un private-purpose trust fund","Un special revenue fund","Un custodial fund"],a:1,w:"El beneficio va a particulares, no a un programa del gobierno. Si los rendimientos apoyaran un cementerio o un parque público sería permanent fund; al beneficiar a personas concretas es fiduciario."},{q:"El costo de una función central de compras y almacén que sirve a los departamentos del propio gobierno va en…",src:"2–19",o:["El General Fund","Un enterprise fund","Un internal service fund","Un capital projects fund"],a:2,w:"Servir a departamentos del mismo gobierno a costo reembolsable es la definición de internal service fund. Si vendiera al público sería enterprise."},{q:"Los impuestos que un gobierno cobra <em>por cuenta de otro gobierno</em> se registran en…",src:"2–19",o:["Un investment trust fund","Un custodial fund","Un special revenue fund","El General Fund"],a:1,w:"No hay acuerdo de fideicomiso; el gobierno solo administra y entrega. Eso es un custodial fund, la categoría fiduciaria más simple."}]},{id:"b3",roman:"III",concept:"Enfoque de medición y base contable",title:"Dos formas de medir la misma transacción",en:"Measurement focus and basis of accounting",standfirst:"Enfoque de medición responde «¿qué se mide?». Base contable responde «¿cuándo se registra?». Van siempre en pareja, y la categoría del fondo decide cuál pareja te toca.",steps:[{head:"La pareja corta",blocks:[{k:"p",t:'Los fondos <em>gubernamentales</em> usan <span class="term">recursos financieros corrientes<i>current financial resources</i></span> con <span class="term">devengado modificado<i>modified accrual</i></span>.'},{k:"p",t:'Se mide solo el efectivo y lo que se convertirá en efectivo a tiempo para pagar obligaciones del periodo. El ingreso se reconoce cuando es <em>medible</em> y está <span class="term">disponible<i>available</i></span>.'},{k:"note",head:"Cuánto es «disponible»",t:"Cada gobierno define su propio plazo, salvo una excepción: los impuestos prediales deben cobrarse <em>dentro de 60 días</em> del cierre para considerarse disponibles. La mayoría adopta 60 días para todo, pero el rango va de 30 días a un año.",tone:"seal"}]},{head:"Qué desaparece del balance",blocks:[{k:"p",t:"Consecuencia directa del enfoque corto: el balance de fondos gubernamentales <em>no reporta</em> activos de capital ni deuda a largo plazo."},{k:"p",t:"Los terrenos, edificios y equipo no sirven para pagar obligaciones del periodo. Las obligaciones a largo plazo no hay que pagarlas este periodo. Ninguno de los dos entra."},{k:"p",t:"Los dos <em>sí</em> aparecen, pero arriba: en la columna de actividades gubernamentales del statement of net position. La misma realidad, medida con la otra pareja."}]},{head:"Expenditures no es expenses",blocks:[{k:"p",t:'Los <span class="term">expenditures<i>egresos</i></span> son los recursos usados para adquirir un activo o servicio, y se reconocen cuando surge la obligación de pagar con recursos corrientes.'},{k:"p",t:'Los <span class="term">expenses<i>gastos</i></span> son costos expirados o consumidos al prestar el servicio. Miden el costo a largo plazo, así que pertenecen al nivel de todo el gobierno.'},{k:"fig",id:"focus",cap:"Comprar una patrulla de $60 000 es un expenditure completo el año de la compra en el fondo; arriba es un activo que se deprecia por años. La misma transacción, dos cifras distintas — y por eso hay conciliación."}]},{head:"La pareja larga",blocks:[{k:"p",t:'Todo lo demás usa <span class="term">recursos económicos<i>economic resources</i></span> con <span class="term">devengado pleno<i>accrual</i></span>: los estados de todo el gobierno, los fondos propietarios y los fondos fiduciarios.'},{k:"p",t:"Los fondos propietarios lo necesitan por una razón práctica: si vas a cobrarle al usuario, tienes que conocer el <em>costo completo</em> del servicio, depreciación incluida, para fijar la tarifa y para decidir si conviene prestarlo o contratarlo fuera."},{k:"p",t:"Los estados por fondos gubernamentales sirven a la rendición de cuentas <em>fiscal</em>. Los demás, a la <em>operativa</em>. Es el mismo par del capítulo 1, ahora con la mecánica."}]}],terms:[["Current financial resources","Efectivo y partidas que se volverán efectivo a tiempo para pagar obligaciones del periodo."],["Modified accrual","Ingresos cuando son medibles y están disponibles; expenditures cuando obligan recursos corrientes."],["Available","Cobrable a tiempo para pagar obligaciones del periodo. 60 días obligatorios para el impuesto predial."],["Economic resources focus","Se miden todos los recursos, corrientes y no corrientes, con devengado pleno."],["Expenditures","Recursos usados para adquirir un activo o servicio. Propio de los fondos gubernamentales."],["Expenses","Costos expirados o consumidos al prestar el servicio. Propio del nivel de todo el gobierno."]],quiz:[{q:"El enfoque de medición y la base contable que deben usar los estados <em>por fondos gubernamentales</em> son…",src:"2–16, ítem 4",o:["Recursos económicos y devengado","Recursos financieros corrientes y devengado modificado","Recursos financieros corrientes y base de efectivo","Recursos económicos y devengado modificado"],a:1,w:"Van siempre juntos: recursos financieros corrientes con devengado modificado. La pareja de recursos económicos con devengado es la de todo el gobierno, propietarios y fiduciarios."},{q:"Bajo devengado modificado…",src:"2–16, ítem 8",o:["Los ingresos se reconocen al ocurrir la transacción de intercambio","Los expenditures se reconocen cuando el costo de un activo expira","Los ingresos se reconocen cuando son medibles y están disponibles para pagar obligaciones del periodo","Los expenses se reconocen cuando surge una obligación por servicios prestados"],a:2,w:"«Medible y disponible» es la fórmula exacta. Las opciones B y D describen devengado pleno, y además usan <em>expenses</em>, que no es el término de los fondos gubernamentales."},{q:"Un condado compra una patrulla de $60 000 en efectivo. ¿Cómo se reporta?",src:"Concepto, LO 2-3",o:["Expenditure de $60 000 en el fondo; activo depreciable en todo el gobierno","Activo depreciable en los dos lugares","Expenditure de $60 000 en los dos lugares","No se reporta hasta que se deprecie"],a:0,w:"Abajo el enfoque es corto: salió efectivo del periodo, así que es un expenditure completo. Arriba el enfoque es largo: es un activo que se consume por años. La conciliación explica la diferencia."},{q:"¿Por qué el balance de fondos gubernamentales no muestra la deuda a largo plazo?",src:"Concepto, LO 2-3",o:["Porque el GASB permite omitirla si es inmaterial","Porque no hay que pagarla con recursos financieros del periodo actual","Porque ya aparece en las notas","Porque se reporta solo en los fondos propietarios"],a:1,w:"El enfoque de recursos financieros corrientes solo admite lo que afecta el periodo. La deuda a largo plazo sí aparece, pero en la columna de actividades gubernamentales de los estados de todo el gobierno."}]},{id:"b4",roman:"IV",concept:"Clasificación del fund balance",title:"Cinco cajones, ordenados por quién puso el candado",en:"Fund balance classifications",standfirst:"La clasificación no describe para qué se va a usar el dinero. Describe quién impuso la restricción y qué tan difícil es quitarla.",steps:[{head:"Primero: ¿se puede gastar?",blocks:[{k:"p",t:'La clasificación se hace en orden. Lo primero es apartar lo <span class="term">no gastable<i>nonspendable</i></span>: lo que no está en forma de poder gastarse, o que por ley o contrato no puede gastarse.'},{k:"p",t:"En forma no gastable: inventarios, pagos anticipados, documentos por cobrar a largo plazo. Legalmente intocable: el principal de una dotación permanente."},{k:"fig",id:"fundbalance",cap:"El orden importa: primero se aparta lo no gastable, y lo que queda se clasifica según quién puso el candado y qué se necesita para quitarlo."}]},{head:"Después: ¿quién puso el candado?",blocks:[{k:"p",t:'<span class="term">Restringido<i>restricted</i></span> — el candado viene de <em>afuera</em>: acreedores, otorgantes, donantes, la constitución, o legislación habilitante. Solo se cambia con el consentimiento de quien lo puso.'},{k:"p",t:'<span class="term">Comprometido<i>committed</i></span> — el candado lo puso el propio gobierno, pero al <em>máximo nivel</em> y por acción formal: una ordenanza del concejo o de la comisión del condado. Quitarlo exige la misma acción formal.'},{k:"p",t:'<span class="term">Asignado<i>assigned</i></span> — hay <em>intención</em> de usarlo para algo, pero sin acción formal. La expresa el cuerpo de gobierno o alguien en quien delegó: un comité de finanzas, el administrador municipal.'}]},{head:"Habilitante no es lo mismo que comprometido",blocks:[{k:"note",head:"La distinción fina que se pregunta",t:"La <em>legislación habilitante</em> autoriza recaudar un ingreso <em>para un fin restringido</em>, y ese componente impide usarlo en otra cosa: eso es <em>restringido</em>. En cambio los fondos <em>comprometidos</em> sí pueden destinarse a otra cosa, revirtiendo la acción formal que los comprometió.",tone:"warn"},{k:"p",t:"Prueba rápida: si para liberarlo basta con que el mismo cuerpo vote de nuevo, es comprometido. Si hace falta el consentimiento de un tercero, es restringido."}]},{head:"Y lo que sobra",blocks:[{k:"p",t:'<span class="term">No asignado<i>unassigned</i></span> es el residuo del General Fund después de clasificar todo lo demás. Técnicamente disponible para cualquier propósito.'},{k:"note",head:"Dos reglas de signo",t:"El General Fund es el <em>único</em> que puede tener un fund balance no asignado <em>positivo</em>. Cualquier otro fondo que gaste de más puede tener que reportar un no asignado <em>negativo</em>. Y el GASB no permite saldos negativos en restringido, comprometido ni asignado.",tone:"warn"},{k:"p",t:"Se sobreentiende además que lo que quede en fondos de special revenue, capital projects, debt service o permanent, sin ser restringido ni comprometido, está <em>asignado</em>."},{k:"p",t:"Por último, el gobierno debe adoptar una política sobre qué se considera gastado primero cuando concurren varias clasificaciones. Lo normal es gastar antes lo más limitado."}]}],terms:[["Nonspendable","No está en forma de gastarse (inventario, anticipos) o legalmente debe mantenerse intacto."],["Restricted","Candado externo: acreedores, otorgantes, donantes, constitución o legislación habilitante."],["Committed","Candado interno al máximo nivel, por acción formal. Se quita con la misma acción formal."],["Assigned","Intención de uso sin acción formal, expresada por el cuerpo de gobierno o quien delegó."],["Unassigned","El residuo del General Fund. Único fondo que puede tenerlo positivo."],["Enabling legislation","Autoriza recaudar para un fin restringido. Produce saldo restringido, no comprometido."]],quiz:[{q:"¿Cuál de estos importes se clasificaría como <em>restricted</em>?",src:"2–16, ítem 5",o:["Recursos que el administrador municipal apartó para reparar una calle","Una subvención federal que solo puede usarse en juegos infantiles","Un monto importante de inventario","Una dotación que la ciudad debe mantener a perpetuidad"],a:1,w:"El otorgante es externo y fijó el destino: restringido. La opción A es asignado (intención sin acción formal); C y D son nonspendable — el inventario por su forma y el principal de la dotación por ley."},{q:"El concejo aprueba una ordenanza que aparta $1 000 000 como reserva de emergencia, retirable solo con dos tercios de los votos. Eso es…",src:"2–20",o:["Restricted","Committed","Assigned","Unassigned"],a:1,w:"El candado lo puso el propio gobierno al máximo nivel y mediante acción formal, y quitarlo exige la misma acción formal. Es committed. Sería restricted solo si el límite viniera de fuera."},{q:"¿Qué fondo puede reportar un <em>unassigned fund balance</em> positivo?",src:"2–16, ítem 15",o:["El General Fund","El General Fund y los special revenue funds","Todos los fondos gubernamentales","Los enterprise funds"],a:0,w:"Solo el General Fund. Otros fondos pueden llegar a reportar un no asignado <em>negativo</em> si gastan por encima de lo restringido, comprometido o asignado, pero nunca uno positivo."},{q:"El alcalde declara que aparta $25 000 para comprar un terreno para un parque, sin ordenanza. Eso es…",src:"2–20",o:["Restricted","Committed","Assigned","Nonspendable"],a:2,w:"Hay intención expresada por alguien con autoridad delegada, pero no hubo acción formal del máximo nivel. Eso es assigned. Con una ordenanza del concejo habría sido committed."}]},{id:"b5",roman:"V",concept:"Determinación de fondos mayores",title:"Qué fondos merecen su propia columna",en:"Major fund determination",standfirst:"Nadie quiere leer cuarenta columnas. El GASB fija una prueba aritmética para decidir cuáles se muestran aparte y cuáles se agregan en una sola.",steps:[{head:"Para qué existe la prueba",blocks:[{k:"p",t:'El GASB reconoce que al usuario no le interesan todos los fondos, sino los de mayor monto. Por eso exige una columna separada por cada <span class="term">fondo mayor<i>major fund</i></span>, más una columna agregada con todos los no mayores.'},{k:"p",t:"Aplica solo a fondos <em>gubernamentales</em> y <em>enterprise</em>. No aplica a internal service ni a fiduciarios."},{k:"p",t:"El General Fund es siempre mayor, por su naturaleza. Para los demás hay que hacer la cuenta."}]},{head:"Las dos vallas",blocks:[{k:"p",t:"Un fondo es mayor si alguno de sus elementos —activos, pasivos, ingresos o egresos— cumple <em>las dos</em> condiciones:"},{k:"p",t:"<em>(a)</em> Es al menos el <em>10 %</em> del mismo elemento para todos los fondos de su categoría. <em>(b)</em> Ese <em>mismo</em> elemento es al menos el <em>5 %</em> del total de fondos gubernamentales y enterprise combinados."},{k:"fig",id:"major",cap:"Las dos vallas se saltan con el mismo elemento. Un fondo que pasa el 10 % en pasivos y el 5 % en ingresos no califica: son elementos distintos."},{k:"note",head:"El error clásico",t:"Cumplir <em>(a)</em> con un elemento y <em>(b)</em> con otro <em>no</em> sirve. Tiene que ser el mismo elemento el que salte las dos vallas.",tone:"warn"}]},{head:"Y el criterio del juicio",blocks:[{k:"p",t:"Además de la aritmética, el gobierno <em>puede</em> reportar como mayor cualquier fondo que considere de importancia significativa para los usuarios, aunque no cumpla los porcentajes."},{k:"p",t:"Y si un fondo cumplió ambos criterios el año pasado pero este año cumple uno o ninguno, el gobierno puede optar por seguir reportándolo como mayor, a la espera de la determinación del año siguiente."},{k:"p",t:"Los no mayores se agregan en una columna, pero muchos gobiernos publican <em>combining statements</em> en el informe anual con el detalle de cada uno."}]},{head:"Y el presupuesto, aparte",blocks:[{k:"p",t:"Ligado a esto, el GASB exige cédulas de comparación presupuesto contra real para el General Fund y para cada <em>special revenue fund mayor</em> que tenga presupuesto legalmente adoptado."},{k:"p",t:"Recomienda presentarlas como RSI justo después de las notas. El gobierno también puede convertirlas en un estado dentro de los estados básicos."}]}],terms:[["Major fund","Fondo que recibe columna propia. El General Fund siempre lo es; los demás pasan la prueba 10 % y 5 %."],["Nonmajor funds","Se agregan en una sola columna, con detalle opcional en combining statements."],["Budgetary comparison schedule","Presupuesto contra real para el General Fund y cada special revenue fund mayor con presupuesto legal."]],quiz:[{q:"Un gobierno reporta activos totales: General $18 400 000; Library (special revenue) $2 900 000; Debt Service $2 600 000; total gubernamentales $26 300 000; gubernamentales y enterprise combinados $51 250 000. ¿Cuáles son mayores por activos?",src:"2–16, ítem 10",o:["Solo el General Fund","General Fund y Library Fund","General Fund y Debt Service Fund","Los tres"],a:1,w:"El 10 % de gubernamentales es $2 630 000; el 5 % del combinado, $2 562 500. Library ($2 900 000) supera ambas. Debt Service ($2 600 000) pasa el 5 % pero se queda $30 000 por debajo del 10 %, así que no es mayor. El General lo es siempre."},{q:"La separación de fondos mayores existe porque…",src:"2–16, ítem 6",o:["Los usuarios quieren el detalle de todos los fondos","Agregar fondos que superen el 5 % viola las normas","Los usuarios necesitan examinar los fondos fiduciarios","Los usuarios necesitan ver los fondos con montos grandes de recursos y actividad"],a:3,w:"La prueba existe para destacar lo material. La opción A es lo contrario del propósito, y la C es falsa: la prueba de fondo mayor no aplica a fiduciarios."},{q:"¿A qué fondos <em>no</em> se les aplica la prueba de fondo mayor?",src:"Concepto, LO 2-4",o:["A los special revenue funds","A los internal service funds y a los fiduciarios","A los enterprise funds","Al General Fund y a los capital projects funds"],a:1,w:"La prueba aplica solo a fondos gubernamentales y enterprise. Los internal service y los fiduciarios quedan fuera."}]}],Nx=[{q:"El MD&A del condado dice que sus fondos fiduciarios «se resumen por tipo: pensiones, otros beneficios y private-purpose trust». ¿Qué falta?",src:"Caso 2–12 · artículo II",o:["Nada: esos son todos los tipos fiduciarios","Faltan los custodial funds","Faltan los internal service funds","Faltan los permanent funds"],a:1,w:"La categoría fiduciaria tiene cuatro tipos: custodial más los tres de fideicomiso. Los permanent funds son gubernamentales y los internal service, propietarios."},{q:"El mismo MD&A dice que los activos fiduciarios «no se presentan como parte de los estados de todo el gobierno». ¿Es correcto?",src:"Caso 2–12 · artículo I",o:["No: deberían ir en una columna fiduciaria","Sí: no pueden financiar los programas del gobierno, así que se omiten","No: van en actividades gubernamentales","Solo si el gobierno es pequeño"],a:1,w:"Es de lo poco que el MD&A dice bien. Como esos recursos no pueden usarse para los programas del gobierno, el GASB exige omitirlos arriba y reportarlos solo en sus dos estados por fondos."},{q:"El MD&A dice que tres actividades enterprise (aeropuerto, transporte y recreación) <em>requieren subsidio de impuestos</em>. ¿Qué implica?",src:"Caso 2–12 · artículo II",o:["Que deben reclasificarse como fondos gubernamentales de inmediato","Nada: los subsidios operativos a actividades tipo negocio son comunes","Que el gobierno violó las normas GASB","Que deben pasar a internal service funds"],a:1,w:"El texto lo dice expresamente: los subsidios de impuestos generales no son raros, sobre todo en transporte. Lo que obliga a usar enterprise fund es la garantía de la deuda, la exigencia legal de recuperar costos o la política de precios."},{q:"¿Por qué el MD&A tiene que explicar las diferencias entre los estados por fondos y los de todo el gobierno?",src:"Caso 2–12 · artículo III",o:["Porque los fondos usan efectivo y arriba se usa devengado","Porque abajo se mide corto plazo y arriba largo plazo, y el GASB exige conciliar","Porque los auditores lo piden","Porque los fondos excluyen las actividades tipo negocio"],a:1,w:"La misma información de actividades gubernamentales aparece con dos enfoques de medición distintos. Por eso el GASB exige conciliar los fund balances con el net position, y el cambio del periodo entre los dos estados operativos."},{q:"El condado quiere clasificar $464 000 de seguro pagado por anticipado en su General Fund. ¿Qué clasificación?",src:"2–20 · artículo IV",o:["Restricted","Committed","Nonspendable","Unassigned"],a:2,w:"Un pago anticipado no está en forma de poder gastarse: es nonspendable, igual que el inventario. Lo primero que se aparta al clasificar."},{q:"Un fondo del condado alcanza el 10 % de los pasivos de su categoría y el 5 % de los ingresos del combinado. ¿Es mayor?",src:"Artículo V",o:["Sí: cumple las dos condiciones","No: las dos vallas debe saltarlas el mismo elemento","Sí, pero solo si el condado lo decide","No hay información suficiente"],a:1,w:"Es el error clásico. Cumplir (a) con pasivos y (b) con ingresos no sirve: tiene que ser el mismo elemento el que pase el 10 % y el 5 %."}],Px={id:"ch2",num:2,name:"Principios para gobiernos estatales y locales",en:"Principles of Accounting and Financial Reporting for State and Local Governments",caseTab:"Expediente · caso 2–12",caseTitle:"El MD&A que no cuadra con la norma",caseLede:["El condado publicó su MD&A describiendo sus estados básicos. Tu trabajo es auditarlo: señalar qué partes <em>sí</em> cumplen las normas GASB y cuáles <em>no</em>.","Para poder juzgarlo hace falta conocer el modelo de reporte, las tres categorías de fondos, qué base contable le toca a cada una, cómo se clasifica el fund balance y qué fondos merecen columna propia. Este capítulo es exactamente eso."],articles:Ax,capstoneLede:"Cinco tareas con guía mínima. La primera es el caso 2–12 propiamente dicho; las demás son la mecánica que te permite resolverlo.",closing:"Ya puedes leer el plan de cuentas de un condado y saber, para cualquier partida, en qué fondo vive, con qué base se mide, cómo se clasifica su saldo y si merece columna propia.",tasks:[{kind:"sort",title:"Audita el MD&A del condado",src:"Caso 2–12, requisito (a)",hint:"Cada frase viene del MD&A. Decide si cumple las normas GASB o no.",bins:[{code:"ok",label:"Conforme a GASB",eyebrow:"Cumple"},{code:"no",label:"No conforme",eyebrow:"Falla"}],items:[["Los estados de todo el gobierno son el statement of net position y el de activities",0],["Los fondos gubernamentales usan devengado modificado",0],["Los fondos propietarios incluyen enterprise e internal service, en devengado",0],["Los activos fiduciarios no se presentan en los estados de todo el gobierno",0],["Los fondos no mayores se resumen en una sola columna",0],["Los fondos fiduciarios se resumen en pensiones, otros beneficios y private-purpose",1],["Los fondos gubernamentales no presentan activos de capital ni deuda a largo plazo",0],["Tres actividades enterprise requieren subsidio de impuestos",0]],note:"La única frase que falla es la lista de fondos fiduciarios: omite los custodial funds. Las demás describen correctamente el modelo — incluidos los subsidios a actividades enterprise, que el texto reconoce como comunes."},{kind:"sort",title:"Cada tipo de fondo, en su categoría",src:"Problema 2–17",hint:"Toca el tipo de fondo, luego su categoría.",bins:[{code:"GF",label:"Gubernamentales",eyebrow:"GF"},{code:"PF",label:"Propietarios",eyebrow:"PF"},{code:"FF",label:"Fiduciarios",eyebrow:"FF"}],items:[["Custodial fund",2],["Permanent fund",0],["Debt service fund",0],["Internal service fund",1],["Pension trust fund",2],["Special revenue fund",0],["Enterprise fund",1],["General Fund",0],["Investment trust fund",2],["Capital projects fund",0],["Private-purpose trust fund",2]],note:"Los dos que más se confunden: el permanent fund es gubernamental aunque suene a fideicomiso, y el internal service es propietario aunque solo sirva al propio gobierno."},{kind:"sort",title:"Clasifica el fund balance de Allentown",src:"Problema 2–20",hint:"Pregúntate quién puso el candado y qué se necesita para quitarlo.",bins:[{code:"N",label:"Nonspendable",eyebrow:"a"},{code:"R",label:"Restricted",eyebrow:"b"},{code:"C",label:"Committed",eyebrow:"c"},{code:"A",label:"Assigned",eyebrow:"d"},{code:"U",label:"Unassigned",eyebrow:"e"}],items:[["$22 000 de inventario en el General Fund",0],["$464 000 de seguro pagado por anticipado",0],["Reserva de emergencia de $1 000 000, retirable con dos tercios del concejo",2],["5 % del impuesto a las ventas apartado por ordenanza para desarrollo económico",2],["$250 000 de subvención federal para vivienda de emergencia",1],["$100 000 de prima de bonos que la administradora apartó para pagar principal",3],["$25 000 que el alcalde aparta para comprar terreno de un parque",3],["Saldo de $50 000 sin restricciones en un special revenue fund",3],["El capital projects fund cerró con saldo negativo",4],["Cambio neto de $154 238 en el General Fund",4]],note:"La ordenanza del concejo compromete; la decisión de la administradora o del alcalde solo asigna. Y ojo con el special revenue sin restricciones: lo que sobra en un fondo que no es el General se considera asignado, no no asignado."},{kind:"major",title:"¿Qué fondos merecen columna propia?",src:"Problema 2–16, ítem 10",hint:"Compara cada elemento contra las dos vallas. Marca cada fondo como mayor o no mayor.",funds:[{name:"General Fund",assets:184e5,liabilities:52e5,revenues:213e5,expenditures:201e5,major:!0,why:"El General Fund es mayor siempre, por su naturaleza. Ni siquiera hay que hacer la cuenta."},{name:"Library Fund (special revenue)",assets:29e5,liabilities:41e4,revenues:315e4,expenditures:298e4,major:!0,why:"Por activos: $2,9 M supera el 10 % de gubernamentales ($2 630 000) y el 5 % del combinado ($2 562 500). El mismo elemento salta las dos vallas."},{name:"Debt Service Fund",assets:26e5,liabilities:18e4,revenues:24e5,expenditures:235e4,major:!1,why:"Por activos, $2,6 M no llega al 10 % de gubernamentales ($2 630 000). Ningún otro elemento salta ambas vallas, así que no es mayor."}],totalCategory:{assets:263e5,liabilities:61e5,revenues:289e5,expenditures:275e5},totalCombined:{assets:5125e4,liabilities:148e5,revenues:552e5,expenditures:527e5},note:"La trampa está en el Debt Service Fund: se queda a $30 000 del 10 %. Por eso la prueba se hace con números, no a ojo."},{kind:"quiz",title:"Vuelve al MD&A",src:"Cruza los cinco artículos",hint:"Seis preguntas sobre el caso del condado.",questions:Nx}],glossary:[["Available","Disponible","Cobrable a tiempo para pagar obligaciones del periodo. El impuesto predial exige 60 días; el resto lo define cada gobierno.","III"],["Assigned fund balance","Saldo asignado","Intención de uso sin acción formal, expresada por el cuerpo de gobierno o por quien este delegó.","IV"],["Business-type activities","Actividades tipo negocio","Servicios cobrados al usuario que buscan autofinanciarse. Los subsidios de impuestos generales no son raros.","I"],["Capital projects fund","Fondo de proyectos de capital","Registra ingresos y bonos destinados a comprar o construir activos de larga vida.","II"],["Committed fund balance","Saldo comprometido","Restringido por acción formal del máximo nivel del gobierno. Se libera con la misma acción formal.","IV"],["Current financial resources","Recursos financieros corrientes","Efectivo y partidas que se volverán efectivo a tiempo para pagar obligaciones del periodo.","III"],["Custodial fund","Fondo de custodia","El gobierno administra activos de terceros sin acuerdo de fideicomiso. Ej.: impuestos cobrados para otro gobierno.","II"],["Debt service fund","Fondo de servicio de deuda","Recursos apartados para pagar principal e intereses de deuda general a largo plazo.","II"],["Deferred outflow / inflow of resources","Salida / entrada diferida","Consumo o adquisición de activos netos que corresponde a un periodo futuro. No es activo ni pasivo: es un elemento propio.","I"],["Economic resources focus","Enfoque de recursos económicos","Se miden todos los recursos, corrientes y no corrientes. Va con devengado pleno.","III"],["Enabling legislation","Legislación habilitante","Autoriza recaudar un ingreso para un fin restringido. Produce saldo restringido, no comprometido.","IV"],["Enterprise fund","Fondo empresarial","Vende al público. Obligatorio si la deuda se garantiza con sus ingresos, si la ley exige recuperar costos, o por política de precios.","II"],["Expenditures","Egresos","Recursos usados para adquirir un activo o servicio, reconocidos al obligar recursos corrientes.","III"],["Expenses","Gastos","Costos expirados o consumidos al prestar el servicio. Miden el costo a largo plazo.","III"],["Fund","Fondo","Entidad fiscal y contable con cuentas que cuadran solas, segregada para una actividad u objetivo específico.","II"],["General Fund","Fondo general","El fondo operativo principal. Uno y solo uno por gobierno. Recibe todo lo que no deba ir a otro lado.","II"],["Internal service fund","Fondo de servicios internos","Sirve a departamentos del propio gobierno. Propietario, pero suele reportarse en actividades gubernamentales.","II"],["Major fund","Fondo mayor","Recibe columna propia. El General siempre; los demás si el mismo elemento pasa el 10 % y el 5 %.","V"],["Modified accrual","Devengado modificado","Ingresos cuando son medibles y están disponibles; expenditures cuando obligan recursos corrientes.","III"],["Nonspendable fund balance","Saldo no gastable","No está en forma de gastarse (inventario, anticipos) o debe mantenerse intacto por ley o contrato.","IV"],["Permanent fund","Fondo permanente","Dotación cuyo principal se preserva y cuyos rendimientos apoyan un propósito público.","II"],["Private-purpose trust fund","Fideicomiso de propósito privado","Beneficia a particulares, organizaciones u otros gobiernos, no a un programa del gobierno.","II"],["Restricted fund balance","Saldo restringido","Candado externo: acreedores, otorgantes, donantes, constitución o legislación habilitante.","IV"],["Special revenue fund","Fondo de ingresos especiales","Ingresos restringidos o comprometidos para un propósito operativo concreto.","II"],["Unassigned fund balance","Saldo no asignado","El residuo del General Fund. Único fondo que puede tenerlo positivo.","IV"]]},Ga=[jx,Px];function sn(t){if(t===void 0)throw new ReferenceError("this hasn't been initialised - super() hasn't been called");return t}function Xm(t,e){t.prototype=Object.create(e.prototype),t.prototype.constructor=t,t.__proto__=e}/*!
